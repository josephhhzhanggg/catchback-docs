  /api/partner/v2/orders/{id}:
    get:
      tags: [Orders]
      operationId: getOrder
      summary: Get an order
      description: |-
        One order. `{id}` is our `id` or your `Idempotency-Key`, so after a lost response you can always find out how an order ended. A multi-pack order's `id` or `Idempotency-Key` returns the whole order with its `units`; one unit's `id` returns that unit. It never includes the `payment`: replay the POST to get that back.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema:
                type: object
                required: [order]
                properties:
                  order: { $ref: '#/components/schemas/AnyOrder' }
              example:
                order:
                  order_id: okx-ord-7f3a9c21
                  id: 3d2b8f0e-6c1a-4f7e-9a51-2b0d8c4e7f13
                  status: minted
                  pack_type: bronze
                  category: pokemon
                  odds: standard
                  price: 25
                  recipient: 0x8f3c...e21a
                  mint_chain: 'evm:196'
                  paid_at: '2026-11-16T18:04:40.002Z'
                  custody: wallet
                  pull:
                    card_id: a1c4e2f8-7b3d-4c5e-9f1a-2b3c4d5e6f70
                    category: pokemon
                    name: Charizard ex 199/165 PSA 10
                    value: 412.5
                    pulled_at: '2026-11-16T18:04:41.317Z'
                  token:
                    chain: 'evm:196'
                    contract: 0x7b1e...c0de
                    token_id: '81264573985362058461377125337283195667'
                    status: confirmed
                    tx: 0x9f2a...
                  failure_reason: null
                  created_at: '2026-11-16T18:02:11.420Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: '`UNKNOWN_ORDER`: no such order in your program, by id or `Idempotency-Key`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Unknown order, code: UNKNOWN_ORDER }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /api/partner/v2/orders/{id}/verification:
    get:
      tags: [Orders]
      operationId: getOrderVerification
      summary: Get an order's proof
      description: |-
        The provably-fair proof for an order's pull, and a public `verify_url` your customer can open to re-run the check with no key. `proof` is exactly what `verify_url` returns.

        `{id}` is a single order's `id` or `Idempotency-Key`, or one unit's `id`. A multi-pack order's own `id` or `Idempotency-Key` returns `BatchVerification`: one proof per unit (a unit not yet opened has `verified: null, pending: true`), and `verified` is true only when every unit's is.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: The proof.
          content:
            application/json:
              schema:
                type: object
                required: [verification]
                properties:
                  verification:
                    anyOf:
                      - $ref: '#/components/schemas/Verification'
                      - $ref: '#/components/schemas/BatchVerification'
              example:
                verification:
                  order_id: okx-ord-7f3a9c21
                  id: 3d2b8f0e-6c1a-4f7e-9a51-2b0d8c4e7f13
                  pull_id: 6a0f2c4e-8b1d-4f3a-9c5e-7d9f1b3a5c71
                  card_id: a1c4e2f8-7b3d-4c5e-9f1a-2b3c4d5e6f70
                  category: pokemon
                  verified: true
                  verification_type: provably_fair
                  verify_url: https://catchbackcards.com/api/verify-pull?transaction_id=6a0f2c4e-8b1d-4f3a-9c5e-7d9f1b3a5c71&card_source=pokemon
                  proof: { verified: true, verification_type: provably_fair }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: '`UNKNOWN_ORDER`: no such order in your program.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Unknown order, code: UNKNOWN_ORDER }
        '409':
          description: '`NOT_PULLED`: the order''s pack hasn''t been opened yet; `status` is the order''s status. A single order only: a multi-pack order answers `200` with pending units.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: This order has not been opened yet, code: NOT_PULLED, status: paid }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503':
          description: |-
            - `VERIFY_UNAVAILABLE`: the proof couldn't be loaded right now; retry shortly.
            - `AUTH_UNAVAILABLE`, or no code: we couldn't check your key or load your program; retry after `Retry-After`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Could not load this pull right now; try again., code: VERIFY_UNAVAILABLE }
  /api/partner/v2/wallets/{address}/tokens:
    get:
      tags: [Tokens]
      operationId: listWalletTokens
      summary: List a wallet's tokens
      description: |-
        The live tokens of your program that a wallet holds, newest first, each with what a sell-back would pay right now. Ownership comes from our chain watcher, so a transfer shows up within a few minutes; a quote always re-reads the owner on chain. `sellback` is indicative: only a quote fixes the amount. At most 200 tokens are returned; `truncated: true` means there are more.
      parameters:
        - name: address
          in: path
          required: true
          description: A wallet address on your mint chain.
          schema: { type: string }
          example: '0x8f3c0a1b2c3d4e5f60718293a4b5c6d7e8f9e21a'
      responses:
        '200':
          description: The wallet's live tokens.
          content:
            application/json:
              schema:
                type: object
                required: [holder, tokens, truncated]
                properties:
                  holder: { type: string, description: 'The address as we store it (EVM lowercase, Solana base58).' }
                  tokens:
                    type: array
                    items: { $ref: '#/components/schemas/WalletToken' }
                  truncated: { type: boolean, description: 'True when the wallet holds more than the 200 returned.' }
              example:
                holder: 0x8f3c...e21a
                tokens:
                  - chain: 'evm:196'
                    contract: 0x7b1e...c0de
                    token_id: '81264573985362058461377125337283195667'
                    status: confirmed
                    card: { id: a1c4e2f8-7b3d-4c5e-9f1a-2b3c4d5e6f70, category: pokemon, name: Charizard ex 199/165 PSA 10 }
                    minted_at: '2026-11-16T18:04:45.110Z'
                    sellback: { amount: 330, rate: 0.8, fresh: false, locked_until: '2026-11-23T18:04:41.317Z' }
                truncated: false
        '400':
          description: '`BAD_ADDRESS`: `{address}` is not a wallet address on your mint chain.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: 'That is not a wallet address on evm:196', code: BAD_ADDRESS }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /api/partner/v2/tokens/{tokenId}:
    get:
      tags: [Tokens]
