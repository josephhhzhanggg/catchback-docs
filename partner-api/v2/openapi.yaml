    get:
      tags: [Shipments]
      operationId: listShipments
      summary: List shipments
      description: Your shipments, newest first, one-token and multi-token together, each in its Get a shipment shape.
      parameters:
        - name: wallet
          in: query
          description: The `holder`, on your mint chain.
          schema: { type: string }
        - name: status
          in: query
