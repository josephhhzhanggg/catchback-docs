  /api/partner/v2/quotes/{quoteId}:
    get:
      tags: [Sell-back]
      operationId: getSellbackQuote
      summary: Get a sell-back quote
      description: |-
        One sell-back quote and its payout. We count a burn after a few block confirmations (EVM) or finalization (Solana), then pay within minutes; the amount paid is always exactly `amount_usd`. Every payout status change is also sent as a `sellback.updated` webhook.
      parameters:
        - name: quoteId
          in: path
          required: true
          description: The `quote_id` from Create a sell-back quote.
          schema: { type: string, pattern: '^0x[0-9a-f]{64}$' }
          example: '0x5e0c7a3b1d2f4e6a8c0b9d7f5e3a1c2b4d6f8e0a9c7b5d3f1e2a4c6b8d0f91ab'
      responses:
        '200':
          description: The quote.
          content:
            application/json:
              schema:
                type: object
                required: [quote]
                properties:
                  quote: { $ref: '#/components/schemas/SellbackQuoteStatus' }
              example:
                quote:
                  quote_id: 0x5e0c...91ab
                  status: redeemed
                  amount_usd: 330
                  holder: 0x8f3c...e21a
                  payout: { chain: 'evm:8453', address: 0x8f3c...e21a, status: sent, tx_hash: 0x77d0..., held: false }
                  expires_at: '2026-11-16T18:30:00.000Z'
                  redeemed_at: '2026-11-16T18:21:13.000Z'
                  burn_tx: 0x3be1...
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: '`UNKNOWN_QUOTE`: no such sell-back quote in your program.'
