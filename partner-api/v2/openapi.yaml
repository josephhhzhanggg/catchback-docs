            - `VERIFY_UNAVAILABLE`: the proof couldn't be loaded right now; retry shortly.
            - `AUTH_UNAVAILABLE`, or no code: we couldn't check your key or load your program; retry after `Retry-After`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Could not load this pull right now; try again., code: VERIFY_UNAVAILABLE }
  /api/partner/v2/wallets/{address}/tokens:
    get:
      tags: [Tokens]
      operationId: listWalletTokens
      summary: List a wallet's tokens
      description: |-
        The live tokens of your program that a wallet holds, newest first, each with what a sell-back would pay right now. Ownership comes from our chain watcher, so a transfer shows up within a few minutes; a quote always re-reads the owner on chain. `sellback` is indicative: only a quote fixes the amount. At most 200 tokens are returned; `truncated: true` means there are more.
      parameters:
        - name: address
          in: path
          required: true
          description: A wallet address on your mint chain.
          schema: { type: string }
          example: '0x8f3c0a1b2c3d4e5f60718293a4b5c6d7e8f9e21a'
      responses:
        '200':
          description: The wallet's live tokens.
          content:
            application/json:
              schema:
                type: object
                required: [holder, tokens, truncated]
                properties:
                  holder: { type: string, description: 'The address as we store it (EVM lowercase, Solana base58).' }
                  tokens:
                    type: array
                    items: { $ref: '#/components/schemas/WalletToken' }
                  truncated: { type: boolean, description: 'True when the wallet holds more than the 200 returned.' }
              example:
                holder: 0x8f3c...e21a
                tokens:
                  - chain: 'evm:196'
                    contract: 0x7b1e...c0de
                    token_id: '81264573985362058461377125337283195667'
                    status: confirmed
                    card: { id: a1c4e2f8-7b3d-4c5e-9f1a-2b3c4d5e6f70, category: pokemon, name: Charizard ex 199/165 PSA 10 }
                    minted_at: '2026-11-16T18:04:45.110Z'
                    sellback: { amount: 330, rate: 0.8, fresh: false, locked_until: '2026-11-23T18:04:41.317Z' }
                truncated: false
        '400':
          description: '`BAD_ADDRESS`: `{address}` is not a wallet address on your mint chain.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: 'That is not a wallet address on evm:196', code: BAD_ADDRESS }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /api/partner/v2/tokens/{tokenId}:
