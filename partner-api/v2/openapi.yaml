                  shipments:
                    type: array
                    items: { $ref: '#/components/schemas/AnyShipment' }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
              example:
                shipments:
                  - quote_id: 0xc41d...77e2
                    status: ready
                    shipping_cost: 9.85
                    holder: 0x8f3c...e21a
                    expires_at: '2026-11-17T18:41:02.000Z'
                    paid_at: '2026-11-16T18:41:02.000Z'
                    burn:
                      quote: { tokenId: '81264573985362058461377125337283195667', kind: 2, quoteId: 0xc41d...77e2, holder: 0x8f3c...e21a, payoutHash: 0x9e04..., amount: '0', expiresAt: '1795458062' }
                      signature: 0x77ab...1c
                    fulfilment: null
                next_cursor: null
        '400':
          description: |-
            - `BAD_CURSOR`: `cursor` isn't a `next_cursor` from a previous page.
            - `BAD_LIMIT`: `limit` isn't 1-100.
            - `BAD_STATUS`: `status` isn't one the list filters on.
            - `BAD_ADDRESS`: `wallet` is not an address on your mint chain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: 'status must be one of awaiting_payment, ready, redeemed, expired, partially_redeemed', code: BAD_STATUS }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
