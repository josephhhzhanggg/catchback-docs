openapi: 3.1.0
info:
  title: CatchBack Partner API v2
  version: 2.0.0
  summary: Sell CatchBack packs to your users, on the Crypto Wallet model (NFTs in their own wallets) or the Non-crypto model (a CatchBack vault per customer, settled on your statement).
  description: |-
    The official contract for Partner API v2. Generate clients from this file.

    Every program runs one of two models, shown as `payment_mode` on Get your key. Guides: [Overview](/partner-api/v2/overview), [Integration models](/partner-api/v2/integration-models).

    - **Crypto Wallet model** (`payment_mode: wallet`): each customer pays for their own pack (USDC on
      Base or Solana, through a Unifold Payment Intent), and each pulled item is minted as an NFT to
      the customer's wallet. Whoever holds the NFT can trade it, sell it back for USDC, or have the
      physical item shipped. Selling back and shipping both burn the NFT. These programs use the
      wallet, token, quote, shipment and burn operations.
    - **Non-crypto model** (`payment_mode: partner`, also called partner settlement): you buy for your
      customer, named by your own id for them (`customer`), each card stays in that customer's
      CatchBack vault, and orders, sell-backs and shipping go on your statement with a credit limit.
      These programs use the operations tagged `Customers` and `Settlement` instead of the wallet,
      token, quote and burn ones. [Non-crypto model](/partner-api/v2/settlement).

    Catalog, odds, orders, webhooks, keys and the sandbox are shared by both.

    - **Auth:** every `/api/partner/v2` request sends your key as a bearer token, and every key
      needs the scope `nft:orders`. The public token metadata needs no key.
    - **Your program:** your key is linked to your partner program, which fixes the chain your
      NFTs mint on (`mint_chain`) and your collection contract. An order, token, quote or shipment
      from another program answers `404`.
    - **Formats:** JSON, UTF-8. Money is USD as a number in dollars (`25`, `9.85`). New fields can be
      added to any response; ignore fields you don't know.
    - **Errors:** bodies are `{ "error": "<message>" }`, and errors your integration should act on
      also carry a stable `code` (see `ErrorCode`). Branch on the status and the `code`, never on the
      message text. [Errors](/partner-api/v2/errors).
    - **Idempotency:** `POST /orders`, `POST /shipments`, `POST /tokens/{tokenId}/shipment`,
      `POST /customers/{customer}/shipments` and `POST /keys/rotate` require an `Idempotency-Key`. [Idempotency](/partner-api/v2/idempotency).
    - **Sandbox:** the sandbox runs the same API with simulated payments on a public testnet. Set it up
      yourself: in your manager (`catchback.com/<slug>/admin/api`), Get started, **Set up my sandbox**, then create a sandbox key there. The operations tagged `Sandbox` exist only there
      and answer `404` in production.
    - **`x-moves-money: true`:** marks the operations that start real money moving in production: the
      customer pays (an order or a shipment), or the holder is paid in USDC (a sell-back quote, and the
      burn that settles it). On a non-crypto program they put an order, a sell-back credit or
      postage on your statement instead. In the sandbox the same operations move
      only simulated money, so flag them in your tooling, but they are safe to call there.
  contact:
    name: CatchBack support
    email: support@catchbackcards.com
servers:
  - url: https://sandbox.catchbackcards.com
    description: Sandbox. Simulated payments, real NFTs on Base Sepolia. Set it up from Get started in your manager. Build and test here first.
  - url: https://catchbackcards.com
    description: Production. Every payment is real money.
tags:
  - name: Packs
    description: The packs you can sell, their odds and every item they can pull.
  - name: Orders
    description: Buy 1-10 packs for one wallet, follow the order to the mint, and prove the pull.
  - name: Tokens
    description: A wallet's tokens and one token's item, holder and sell-back schedule.
  - name: Sell-back
    description: Quote a sell-back, have the holder burn with it, and follow the USDC payout.
  - name: Shipments
    description: Pay shipping for 1-25 tokens, have the holder burn each one, and track the box.
  - name: Webhooks
    description: Register, read, test and remove your webhook URL.
  - name: Webhook events
    description: Signed POSTs we send to your webhook URL.
  - name: Keys
    description: Read, rotate and revoke your API key.
  - name: Revenue
    description: Your monthly revenue-share statement.
  - name: Customers
    description: 'non-crypto programs only: a customer''s vault, sell-backs and shipments, by your own id for the customer.'
  - name: Settlement
    description: 'non-crypto programs only: what you owe, your limits and your monthly statement.'
  - name: Sandbox
    description: Sandbox-only helpers. Every one answers `404` in production.
  - name: Metadata
    description: Public NFT metadata that wallets and marketplaces read with no key.
security:
  - bearerAuth: ['nft:orders']
# A keyless operation below says `security: [{}]`, not `[]`. With an empty list Mintlify falls
# back to docs.json's api.mdx.auth and shows a bearer header on the page.
paths:
  /api/partner/v2/catalog/packs:
    get:
      tags: [Packs]
      operationId: listPacks
      summary: List packs
      description: |-
        The packs you can sell in one category, with price, the odds choices each sells, art and the chase item on offer. A pack that isn't on sale right now stays listed with `available: false` and a `reason`. Whether a particular odds choice is selling right now is on [Get a pack's pool](#operation/getPackPool).

        Both catalog reads (List packs and Get a pack's odds and pool) can be up to a minute old: we cache them for a minute, so repeat reads are fast however often you call them (the first read after a quiet spell or a deploy can take several seconds). Stock is checked again when you create the order, so a pack that sold out in that minute is refused there: `409 ODDS_UNAVAILABLE` (with `odds`) on a pack that sells the odds choice, `409 PACK_UNAVAILABLE` (with its `reason`) on one that sells only its own odds.
      parameters:
        - $ref: '#/components/parameters/PackCategory'
      responses:
        '200':
          description: The packs.
          content:
            application/json:
              schema:
                type: object
                required: [category, mint_chain, packs]
                properties:
                  category: { $ref: '#/components/schemas/PackCategory' }
                  mint_chain: { $ref: '#/components/schemas/ChainKey' }
                  packs:
                    type: array
                    items: { $ref: '#/components/schemas/PackCatalogItem' }
              example:
                category: pokemon
                mint_chain: 'evm:196'
                packs:
                  - pack_type: bronze
                    name: Bronze Pack
                    price: 25
                    available: true
                    odds: [standard, hot, chill, classic]
                    default_odds: standard
                    image_url: https://catchbackcards.com/_next/image?url=%2Fpacks%2Fbronze.png&w=1080&q=75
                    banner_url: https://catchbackcards.com/_next/image?url=%2Fpacks%2Fbronze-banner.png&w=1080&q=75
                    description: Graded Pokemon slabs from $7.50 up.
                    chase:
                      label: Charizard bounty
                      odds: '0.05%'
                      ends_at: '2026-11-30T00:00:00.000Z'
                      item:
                        id: 0e94dc61-5a2f-4b1e-9c3d-7f8a1b2c3d4e
                        category: pokemon
                        name: Charizard ex
                        grading_company: PSA
                        grading_rank: 10
                        render_image: https://...
                        market_value: 410
                  - pack_type: gold
                    name: Gold Pack
                    price: 100
                    available: false
                    reason: Restocking
                    odds: [standard, hot, chill, classic]
                    default_odds: standard
                    image_url: https://...
                    banner_url: null
                    description: null
                    chase: null
        '400':
          description: Unknown `category` (no `code`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: 'Unknown category: pokemn' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /api/partner/v2/catalog/packs/pool:
    get:
      tags: [Packs]
      operationId: getPackPool
      summary: Get a pack's pool
      description: |-
        What one pack can pull at one odds choice: the value bands with their chances, whether those odds are selling right now, and every item a pull can produce, highest value first. This is the same information as the odds panel in our app; show it to your customers before they buy.

        Both catalog reads (List packs and Get a pack's odds and pool) can be up to a minute old: we cache them for a minute, so repeat reads are fast however often you call them (the first read after a quiet spell or a deploy can take several seconds). Stock is checked again when you create the order, so a pack that sold out in that minute is refused there: `409 ODDS_UNAVAILABLE` (with `odds`) on a pack that sells the odds choice, `409 PACK_UNAVAILABLE` (with its `reason`) on one that sells only its own odds.

        A pack that sells only its own odds answers `odds: "classic"` with its own band shape (`ClassicPackPool`). Every other pack answers `ModePackPool`.
      parameters:
        - name: pack_type
          in: query
          required: true
          description: A `pack_type` from List packs.
          schema: { type: string, minLength: 1, maxLength: 100 }
          example: bronze
        - $ref: '#/components/parameters/PackCategory'
        - name: odds
          in: query
          description: One the pack sells. Default the pack's `default_odds`.
          schema: { $ref: '#/components/schemas/Odds' }
      responses:
        '200':
          description: The pool at those odds.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PackPool' }
              example:
                pack_type: bronze
                name: Bronze Pack
                category: pokemon
                price: 25
                odds: hot
                label: Hot
                tagline: Fewer hits, bigger chase
                available: true
                fresh_buyback_rate: 1
                consolation_probability: null
                bands:
                  - { band: 7.5-15, min_value: 7.5, max_value: 15, odds: 0.61, cards: 380 }
                  - { band: 250-1000, min_value: 250, max_value: 1000, odds: 0.004, cards: 41 }
                odds_choices:
                  - { odds: standard, label: Standard, available: true }
                  - { odds: hot, label: Hot, available: true }
                  - { odds: chill, label: Chill, available: true }
                  - { odds: classic, label: Classic, available: true }
                total_cards: 1043
                cards:
                  - id: 0e94dc61-5a2f-4b1e-9c3d-7f8a1b2c3d4e
                    category: pokemon
                    name: Charizard ex
                    grading_company: PSA
                    grading_rank: 10
                    market_value: 410
                    render_image: https://...
                    band: 250-1000
        '400':
          description: |-
            - `BAD_PACK`: `pack_type` missing (or over 100 characters).
            - `BAD_CATEGORY`: unknown `category`.
            - `BAD_ODDS`: `odds` isn't `standard`, `hot`, `chill` or `classic`, or isn't one the pack sells; in the second case `odds` lists the choices it sells.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: 'bronze sells standard, hot, chill, classic', code: BAD_ODDS, odds: [standard, hot, chill, classic] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: '`PACK_NOT_OFFERED`: that pack isn''t sold through your program.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Unknown pack_type for pokemon. Use one from GET /api/partner/v2/catalog/packs., code: PACK_NOT_OFFERED }
        '409':
          description: '`ODDS_UNAVAILABLE`: those odds aren''t published for this pack right now; try another choice or later.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: hot odds are not published for bronze, code: ODDS_UNAVAILABLE }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /api/partner/v2/orders:
    post:
      tags: [Orders]
      operationId: createOrder
      x-moves-money: true
      summary: Create an order
      description: |-
        **Rate limit:** 30 a minute, shared with Sell back a customer's card and Create a customer shipment.

        One order buys 1-10 packs of one kind for one wallet, paid with one payment. `quantity` 2-10 makes a multi-pack order (`OrderBatch`): one payment for `quantity` × the pack price, whose units each open, mint and (if they must) refund on their own. The pack opens and the NFT mints once the payment settles; follow it with Get an order or the `nft_order.updated` webhook.

        A refused order creates nothing. A replay with the same `Idempotency-Key` and the same request answers `200` with `idempotent_replay: true` and the order as it stands now; once the order is past `awaiting_payment`, its `payment` has no `client_secret` and no deposit addresses.

        If the odds stop selling before the payment settles, the pack isn't opened at other odds: the order goes to `refund_due` and the customer is refunded.

        **non-crypto programs:** send `customer` (your id for the customer) and no wallet fields (`recipient`, `refund_address`, `partner_user_ref`, `holder`, `payout_chain`, `payout_address`): sending any of them is `400 WALLET_FIELDS_NOT_ACCEPTED`. There is no payment step: the order is charged to your statement when it is accepted, its packs open at once, and the response has no `payment`. The order has `custody: vault` and `customer`, `recipient` and `mint_chain` are null, and each pack ends `in_vault` (or `refunded`, with the price taken back off your statement, if it can't open). The first order for a new `customer` creates that customer. [Non-crypto model](/partner-api/v2/settlement).
      parameters:
        - $ref: '#/components/parameters/OrderIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
            examples:
              wallet:
                summary: A Crypto Wallet program
                value:
                  pack_type: bronze
                  category: pokemon
                  odds: standard
                  quantity: 1
                  recipient: 0x8f3c...e21a
                  refund_address: 0x8f3c...e21a
                  partner_user_ref: okx-uid-102938
              settled:
                summary: A non-crypto program
                value:
                  pack_type: bronze
                  category: pokemon
                  odds: standard
                  quantity: 1
                  customer: user-1842
      responses:
        '201':
          description: The order and, on a Crypto Wallet program, how to pay it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateOrderResponse' }
              examples:
                single:
                  summary: One pack
                  value:
                    order:
                      order_id: okx-ord-7f3a9c21
                      id: 3d2b8f0e-6c1a-4f7e-9a51-2b0d8c4e7f13
                      status: awaiting_payment
                      pack_type: bronze
                      category: pokemon
                      odds: standard
                      price: 25
                      recipient: 0x8f3c...e21a
                      mint_chain: 'evm:196'
                      paid_at: null
                      custody: wallet
                      pull: null
                      token: null
                      failure_reason: null
                      created_at: '2026-11-16T18:02:11.420Z'
                    payment:
                      intent_id: pi_01JD...
                      client_secret: pi_01JD..._secret_...
                      publishable_key: pk_live_...
                      amount: 25
                      deposit_addresses:
                        - { chain: 'evm:8453', address: 0x5a4d...0001 }
                        - { chain: 'solana:mainnet', address: 9xQe...Vf2p }
                multi:
                  summary: Three packs
                  value:
                    order:
                      order_id: okx-ord-9b21e4c0
                      id: 5f1c2a90-8d3e-4b6a-9e1f-7c0a2b4d6e81
                      status: awaiting_payment
                      quantity: 3
                      pack_type: bronze
                      category: pokemon
                      odds: standard
                      unit_price: 25
                      price: 75
                      recipient: 0x8f3c...e21a
                      mint_chain: 'evm:196'
                      paid_at: null
                      units:
                        - { order_id: okx-ord-9b21e4c0, id: a0e1c3d5-2b4f-4e6a-8c1d-3f5a7b9c1e20, batch_id: 5f1c2a90-8d3e-4b6a-9e1f-7c0a2b4d6e81, unit: 1, status: awaiting_payment, pack_type: bronze, category: pokemon, odds: standard, price: 25, recipient: 0x8f3c...e21a, mint_chain: 'evm:196', paid_at: null, custody: wallet, pull: null, token: null, failure_reason: null, created_at: '2026-11-16T18:02:11.420Z' }
                        - { order_id: okx-ord-9b21e4c0, id: b7d2e4f6-3c5a-4f7b-9d2e-4a6b8c0d2f31, batch_id: 5f1c2a90-8d3e-4b6a-9e1f-7c0a2b4d6e81, unit: 2, status: awaiting_payment, pack_type: bronze, category: pokemon, odds: standard, price: 25, recipient: 0x8f3c...e21a, mint_chain: 'evm:196', paid_at: null, custody: wallet, pull: null, token: null, failure_reason: null, created_at: '2026-11-16T18:02:11.420Z' }
                        - { order_id: okx-ord-9b21e4c0, id: c4f9a1b3-4d6e-4a8c-8e3f-5b7c9d1e3a42, batch_id: 5f1c2a90-8d3e-4b6a-9e1f-7c0a2b4d6e81, unit: 3, status: awaiting_payment, pack_type: bronze, category: pokemon, odds: standard, price: 25, recipient: 0x8f3c...e21a, mint_chain: 'evm:196', paid_at: null, custody: wallet, pull: null, token: null, failure_reason: null, created_at: '2026-11-16T18:02:11.420Z' }
                      created_at: '2026-11-16T18:02:11.420Z'
                    payment:
                      intent_id: pi_01JD...
                      client_secret: pi_01JD..._secret_...
                      publishable_key: pk_live_...
                      amount: 75
                      deposit_addresses:
                        - { chain: 'evm:8453', address: 0x5a4d...0001 }
                        - { chain: 'solana:mainnet', address: 9xQe...Vf2p }
                settled:
                  summary: Non-crypto model (no payment)
                  value:
                    order:
                      order_id: acme-ord-7f3a91
                      id: 9c4e1a7b-2d3f-4e5a-8b6c-0d1e2f3a4b5c
                      status: in_vault
                      pack_type: bronze
                      category: pokemon
                      odds: standard
                      price: 25
                      recipient: null
                      mint_chain: null
                      paid_at: '2026-11-24T18:02:10.884Z'
                      custody: vault
                      customer: user-1842
                      pull: { card_id: 838a5e7f-dc62-4618-ad4a-cf015de20536, category: pokemon, name: Charizard ex PSA 10, value: 31, pulled_at: '2026-11-24T18:02:11.317Z' }
                      token: null
                      failure_reason: null
                      created_at: '2026-11-24T18:02:10.884Z'
        '200':
          description: A replay of an earlier request with the same `Idempotency-Key` (`idempotent_replay` is true). Nothing new is created and nothing is charged twice.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateOrderResponse' }
        '400':
          description: |-
            - `BAD_IDEMPOTENCY_KEY`: `Idempotency-Key` missing, or not 8-128 characters of `A-Za-z0-9_-`.
            - `BAD_JSON`: the body isn't JSON.
            - `BAD_RECIPIENT`: `recipient` is not a wallet address on your mint chain.
            - `BAD_PACK`: `pack_type` missing.
            - `BAD_CATEGORY`: unknown `category`.
            - `BAD_ODDS`: `odds` isn't `standard`, `hot`, `chill` or `classic`, or not one the pack sells (then `odds` lists the choices it sells).
            - `BAD_QUANTITY`: `quantity` isn't a whole number from 1 to 10.
            - `BAD_REFUND_ADDRESS`: no usable EVM `refund_address` (required when you mint on Solana).
            - `WALLET_FIELDS_NOT_ACCEPTED`: non-crypto program: a wallet field (`recipient`, `refund_address`, `partner_user_ref`, `holder`, `payout_chain`, `payout_address`) was sent. Send `customer` only.
            - `BAD_CUSTOMER`: non-crypto program: `customer` is missing, or not 1-128 characters of `A-Za-z0-9_.:-`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: 'recipient must be a evm:196 wallet address', code: BAD_RECIPIENT }
        '402':
          description: '`CREDIT_LIMIT`: non-crypto program: the order would take what you owe past your credit limit. The body has `owed`, `credit_limit` and `order_total`. Nothing is created or charged.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: This order would take your statement past its credit limit., code: CREDIT_LIMIT, owed: 9990, credit_limit: 10000, order_total: 25 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: |-
            - `WALLET_REFUSED`: a wallet in the request failed sanctions screening.
            - `WALLET_BLOCKED`: this wallet may not buy from CatchBack.
            - `CUSTOMER_BLOCKED`: non-crypto program: we can't sell to this customer. Don't retry.
            - Any of the key and program refusals every endpoint can return (`NO_PROGRAM`, `PROGRAM_INACTIVE`, `NOT_AVAILABLE`, a missing scope, `Access denied`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: This wallet cannot buy here., code: WALLET_REFUSED }
        '404':
          description: '`PACK_NOT_OFFERED`: that pack isn''t sold through your program.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: That pack is not sold through this program., code: PACK_NOT_OFFERED }
        '409':
          description: |-
            Nothing is created.
            - `ODDS_UNAVAILABLE`: those odds aren't selling right now; try another choice or later. `odds` echoes the choice.
            - `PACK_UNAVAILABLE`: a pack that sells only its own odds can't open right now; `reason` says why.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Bronze Pack isn't selling hot odds right now., code: ODDS_UNAVAILABLE, odds: hot }
        '422':
          description: '`IDEMPOTENCY_KEY_REUSED`: the key was already used for a different order.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: This Idempotency-Key was already used for a different order., code: IDEMPOTENCY_KEY_REUSED }
        '429':
          description: |-
            Nothing is created or charged.
            - `RATE_LIMITED`: too many requests from this key; wait `retry_after_seconds`.
            - `CUSTOMER_DAILY_LIMIT`: non-crypto program: the order would take this customer past their daily limit (a UTC day). The body has `spent_today`, `limit`, `order_total` and `retry_after_seconds` (until UTC midnight).
            - `DAILY_LIMIT`: non-crypto program: the order would take your program past its daily limit, if it has one. Same fields.
            - `TOO_MANY_UNPAID_ORDERS`: Crypto Wallet program: this wallet already has too many unpaid packs in your program (30 ordered in the last 10 minutes, or 100 open). The body has `unpaid_packs`, `limit` and `retry_after_seconds`. Have it pay one, or wait.
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: This order would take the customer past their daily limit., code: CUSTOMER_DAILY_LIMIT, spent_today: 490, limit: 500, order_total: 25, retry_after_seconds: 21342 }
        '500': { $ref: '#/components/responses/ServerError' }
        '503':
          description: |-
            - `SCREENING_UNAVAILABLE`: wallet screening is briefly unavailable; retry shortly with the same `Idempotency-Key`.
            - `CUSTOMER_CHECK_UNAVAILABLE`: non-crypto program: we couldn't check the customer just now; nothing was charged. Retry shortly with the same `Idempotency-Key`.
            - `AUTH_UNAVAILABLE`, or no code: we couldn't check your key or load your program; retry after `Retry-After`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Wallet screening is unavailable; try again shortly., code: SCREENING_UNAVAILABLE }
    get:
      tags: [Orders]
      operationId: listOrders
      summary: List orders
      description: |-
        Your orders, newest first, each in the Get an order shape. The units of a multi-pack order are listed one by one, each with the order's `order_id`, its `batch_id` and its `unit` number. `partner_user_ref` matches the orders you sent with that ref, whichever wallet they went to. On a non-crypto program, filter by a customer with `partner_user_ref` set to their `customer` id.
      parameters:
        - $ref: '#/components/parameters/WalletFilter'
        - name: partner_user_ref
          in: query
          description: A `partner_user_ref` you sent with an order. On a non-crypto program, a `customer` id.
          schema: { type: string, pattern: '^[A-Za-z0-9_.:-]{1,128}$' }
        - name: status
          in: query
          description: Only orders in this status.
          schema:
            type: string
            enum: [awaiting_payment, paid, rolled, minted, in_vault, mint_failed, expired, refund_due, refunded]
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
