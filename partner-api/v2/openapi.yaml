  /api/partner/v2/shipments/{id}:
    get:
      tags: [Shipments]
      operationId: getShipment
      summary: Get a shipment
      description: |-
        One shipment: its burn details once paid, then the box's tracking. `{id}` is a `shipment_id`, or any `quote_id` (a token in a multi-token shipment returns its whole shipment).

        Once the shipping payment settles, `status` becomes `ready` and each token's `burn` holds what the holder burns it with: on EVM the signed quote for `burnWithQuote` (`kind` 2, `amount` "0"), on Solana a fresh transaction built on every GET (fetch it right before signing). The burn window is 24 hours from payment (`expires_at`), shared by every token in the shipment. We never return the delivery address or the shipping label, and never the `payment`: replay the create POST to get it.
      parameters:
        - $ref: '#/components/parameters/ShipmentId'
      responses:
        '200':
          description: The shipment.
          content:
            application/json:
              schema:
                type: object
                required: [shipment]
                properties:
                  shipment: { $ref: '#/components/schemas/AnyShipment' }
              example:
                shipment:
                  shipment_id: 7e2a91c4-5b0d-4f3e-8a6c-1d9b0e2f4a73
                  status: redeemed
                  shipping_cost: 9.85
                  holder: 0x8f3c...e21a
                  expires_at: '2026-11-17T18:41:02.000Z'
                  paid_at: '2026-11-16T18:41:02.000Z'
                  tokens:
                    - { token_id: '90311820476190023716442901288201455', quote_id: 0x1b7c...e4a0, status: redeemed, burned_at: '2026-11-16T19:02:10.000Z', burn_tx: 0x51c0..., burn: null }
                    - { token_id: '81264573985362058461377125337283195667', quote_id: 0xa93f...0c2d, status: redeemed, burned_at: '2026-11-16T19:04:55.000Z', burn_tx: 0x3be1..., burn: null }
                  fulfilment:
                    status: shipped
                    carrier: USPS
                    service: Priority Mail
                    tracking_number: '9400111899223456789012'
                    tracking_url: https://tools.usps.com/go/TrackConfirmAction?tLabels=9400111899223456789012
                    shipped_at: '2026-11-17T16:02:11.000Z'
                    expected_delivery: '2026-11-20'
                    delivered_at: null
                    created_at: '2026-11-16T19:05:30.000Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/UnknownShipment' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /api/partner/v2/shipments/{id}/renew:
    post:
      tags: [Shipments]
      operationId: renewShipment
      summary: Renew a shipment's burn window
      description: |-
        Gives the unburned tokens of a paid shipment a new 24-hour burn window under the same `quote_id`s; the shipping already paid still counts. `{id}` is a `shipment_id` or any `quote_id`. No body. A window that is still open is returned unchanged with `renewed: false`.

        If a multi-token shipment's window lapses and it isn't renewed, it closes 24 hours after `expires_at`: the tokens already burned ship, and the rest are `dropped` (still live in the holder's wallet). A one-token shipment never closes by itself, and answers in its own shape.
      parameters:
        - $ref: '#/components/parameters/ShipmentId'
      responses:
        '200':
          description: The shipment, renewed or as it was.
          content:
            application/json:
              schema:
                type: object
                required: [shipment, renewed]
                properties:
                  shipment: { $ref: '#/components/schemas/AnyShipment' }
                  renewed: { type: boolean, description: 'False when the window was still open and nothing changed.' }
              example:
                shipment:
                  shipment_id: 7e2a91c4-5b0d-4f3e-8a6c-1d9b0e2f4a73
                  status: ready
                  shipping_cost: 9.85
                  holder: 0x8f3c...e21a
                  expires_at: '2026-11-19T09:12:40.000Z'
                  paid_at: '2026-11-16T18:41:02.000Z'
                  tokens:
                    - { token_id: '90311820476190023716442901288201455', quote_id: 0x1b7c...e4a0, status: redeemed, burned_at: '2026-11-16T19:02:10.000Z', burn_tx: 0x51c0..., burn: null }
                    - token_id: '81264573985362058461377125337283195667'
                      quote_id: 0xa93f...0c2d
                      status: ready
                      burned_at: null
                      burn_tx: null
                      burn:
                        quote: { tokenId: '81264573985362058461377125337283195667', kind: 2, quoteId: 0xa93f...0c2d, holder: 0x8f3c...e21a, payoutHash: 0x6d2e..., amount: '0', expiresAt: '1795598000' }
                        signature: 0x2f9c...4b
                  fulfilment: null
                renewed: true
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/UnknownShipment' }
        '409':
          description: |-
            - `NOT_PAID`: the shipping isn't paid yet.
            - `ALREADY_REDEEMED`: the token (every token, on a multi-token shipment) was already burned and the box is shipping.
            - `TOKEN_NOT_LIVE`: a token in the shipment was burned some other way (`token_ids` lists it).
            - `HOLDER_CHANGED`: a token still to be burned changed hands after the shipping was paid (`token_ids` lists them on a multi-token shipment). The shipment can't be renewed: contact CatchBack support with the `shipment_id` or `quote_id`. Tokens already burned still ship once the grace period ends.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Pay for the shipping first; the burns are released once it is paid., code: NOT_PAID }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/ChainUnavailable' }
  /api/partner/v2/customers/{customer}/vault:
    get:
      tags: [Customers]
      operationId: getCustomerVault
      summary: Get a customer's vault
      description: |-
        **non-crypto programs only.** [Non-crypto model](/partner-api/v2/settlement).

        The cards your orders pulled into this customer's vault that they still hold, newest first, each with what it sells back for right now. A sold or shipped card leaves the vault. A customer you have never sold to has an empty vault (not a `404`); the customer shipment operations answer `404 CUSTOMER_NOT_FOUND` for one. `truncated` is true when the customer has more pulls than one read covers (200).
      parameters:
        - $ref: '#/components/parameters/Customer'
      responses:
        '200':
          description: The vault.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerVault' }
              example:
                customer: user-1842
                cards:
                  - card: { id: 838a5e7f-dc62-4618-ad4a-cf015de20536, category: pokemon, name: Charizard ex PSA 10 }
                    order_id: acme-ord-7f3a91
                    pulled_at: '2026-11-24T18:02:11.317Z'
                    value_at_pull: 31
                    sellback: { amount: 31, rate: 1, fresh: true, locked_until: '2026-12-01T18:02:11.317Z' }
                truncated: false
        '400': { $ref: '#/components/responses/CustomerBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /api/partner/v2/customers/{customer}/cards/{card_id}/sellback:
    post:
      tags: [Customers]
      operationId: sellBackCustomerCard
      x-moves-money: true
      summary: Sell back a customer's card
      description: |-
        **non-crypto programs only.** **Rate limit:** 30 a minute, shared with Create an order and Create a customer shipment.

        Sells one vault card back at its current offer (the `sellback.amount` Get a customer's vault shows) and credits the payout to your statement. Nothing is paid out to the customer: you credit them your way. `min_payout` refuses an offer below it, so the customer is never paid less than you showed them.

        A card sells once: a retry returns the first sale (`200`, `status: already_sold`) and never sells again, so no `Idempotency-Key` is needed. Retries sent at the same time get the same answer: one sells, the rest return `already_sold`. [Non-crypto model](/partner-api/v2/settlement).
      parameters:
        - $ref: '#/components/parameters/Customer'
        - name: card_id
          in: path
          required: true
          description: A `card.id` from Get a customer's vault. A UUID matches in any case.
          schema: { type: string, pattern: '^[A-Za-z0-9_.:-]{1,128}$' }
          example: 838a5e7f-dc62-4618-ad4a-cf015de20536
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerSellbackRequest' }
            example: { min_payout: 30 }
      responses:
        '201':
          description: Sold. The payout is on your statement.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerSellbackResponse' }
              example:
                sellback: { status: sold, card_id: 838a5e7f-dc62-4618-ad4a-cf015de20536, transaction_id: 5b1e2c3d-4f5a-4b6c-8d7e-9f0a1b2c3d4e, payout_amount: 31, payout_rate: 1, on_statement: true }
        '200':
          description: Already sold. The first sale, unchanged; nothing is sold or credited again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerSellbackResponse' }
              example:
                sellback: { status: already_sold, card_id: 838a5e7f-dc62-4618-ad4a-cf015de20536, transaction_id: 5b1e2c3d-4f5a-4b6c-8d7e-9f0a1b2c3d4e, payout_amount: 31, payout_rate: null, on_statement: true }
        '400':
          description: |-
            - `NOT_PARTNER_SETTLED`: your program pays through customer wallets; sell back with a quote and a burn.
            - `BAD_CUSTOMER`: `customer` isn't 1-128 characters of `A-Za-z0-9_.:-`.
            - `BAD_CARD`: `card_id` isn't a card id.
            - `BAD_JSON`: the body isn't JSON.
            - `BAD_MIN_PAYOUT`: `min_payout` isn't a non-negative number.
            - `SELLBACK_REFUSED`: the sale itself was refused, for example a card that was shipped or is on its way out. The message says why. Nothing is sold.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: min_payout must be a non-negative number, code: BAD_MIN_PAYOUT }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: |-
            - `CUSTOMER_NOT_FOUND`: no customer with that id has bought from your program.
            - `CARD_NOT_IN_VAULT`: your program didn't pull that card into this customer's vault.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: That card was not pulled into this customer's vault by this program., code: CARD_NOT_IN_VAULT }
        '409':
          description: '`PRICE_CHANGED`: the current offer is below `min_payout`; the body has the current `payout_amount` and `payout_rate`. Nothing is sold. Other refusals of the sale itself answer with their own status and `code`, or `SELLBACK_REFUSED` when they have none.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: 'This sell-back pays 29.5, below your min_payout of 30', code: PRICE_CHANGED, payout_amount: 29.5, payout_rate: 1 }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /api/partner/v2/customers/{customer}/shipments/estimate:
    post:
      tags: [Customers]
      operationId: estimateCustomerShipment
      summary: Estimate a customer shipment
      description: |-
        **non-crypto programs only.** **Rate limit:** 30 a minute, shared with Estimate a shipment and Estimate a one-token shipment.

        Live carrier rates to ship 1-10 of a customer's vault cards in one box to an address. Charges nothing and stores nothing: the address only goes to the carrier for the quote. Pass a rate's `carrier` and `token` to Create a customer shipment, with `max_cost` set to that rate's `total` if you sent `cover_amount` (the postage plus the cover's premium), else its `amount`. [Non-crypto model](/partner-api/v2/settlement).
      parameters:
        - $ref: '#/components/parameters/Customer'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerShipmentEstimateRequest' }
            example:
              card_ids: [838a5e7f-dc62-4618-ad4a-cf015de20536]
              address: { name: Alice Tester, address1: 1 Market St, city: San Francisco, state: CA, zip: '94105', country: US, phone: '4155550100' }
      responses:
        '200':
          description: The rates.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerShippingRates' }
              examples:
                uninsured:
                  summary: No cover
                  value:
                    destination_country: US
                    package_type: mailer
                    order_value: 31
                    max_cover: null
                    rates:
                      - { carrier: USPS, service: Ground Advantage, token: r_9f3c, amount: 7.5, estimated_days: 3 }
                insured:
                  summary: With cover_amount
                  value:
                    destination_country: US
                    package_type: mailer
                    order_value: 420
                    max_cover: 420
                    cover_amount: 400
                    rates:
                      - { carrier: USPS, service: Priority Mail, token: r_1a7d, amount: 9.85, estimated_days: 2, cover_available: true, insurance_premium: 4.2, total: 14.05 }
        '400': { $ref: '#/components/responses/CustomerShipmentBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CustomerShipmentForbidden' }
        '404': { $ref: '#/components/responses/CustomerNotFound' }
        '409': { $ref: '#/components/responses/CustomerCardsConflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '502':
          description: The carrier didn't answer (no `code`). Retry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Could not get carrier rates. Please try again. }
        '503':
          description: We couldn't check the customer or the cards just now (no `code`), or `AUTH_UNAVAILABLE`. Retry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Could not check these cards. Please try again. }
  /api/partner/v2/customers/{customer}/shipments:
    post:
      tags: [Customers]
      operationId: createCustomerShipment
      x-moves-money: true
      summary: Create a customer shipment
      description: |-
        **non-crypto programs only.** **Rate limit:** 30 a minute, shared with Create an order and Sell back a customer's card.

        Ships 1-10 of a customer's vault cards in one box at a rate from Estimate a customer shipment. We re-quote the rate; the postage (and any cover's premium) goes on your statement, and nothing is paid or signed. Past your credit limit it is refused with `402 CREDIT_LIMIT`. A shipment that doesn't go through is taken off your statement.

        The response is the shipment (`processing`), with its `id`. It then moves to `shipped` (with `carrier` and `tracking_number`) and `delivered`: follow it with List a customer's shipments or the `nft_shipment.updated` webhook. A replay with the same `Idempotency-Key` answers `200` with the shipment as it stands now and `idempotent_replay: true`, and never charges twice. Each key may create at most 50 shipments a UTC day. [Non-crypto model](/partner-api/v2/settlement).
      parameters:
        - $ref: '#/components/parameters/Customer'
        - $ref: '#/components/parameters/CustomerShipmentIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCustomerShipmentRequest' }
            example:
              card_ids: [838a5e7f-dc62-4618-ad4a-cf015de20536]
              address: { name: Alice Tester, address1: 1 Market St, city: San Francisco, state: CA, zip: '94105', country: US, phone: '4155550100' }
              rate: { carrier: USPS, token: r_9f3c }
              max_cost: 7.5
      responses:
        '201':
          description: Created. The postage is on your statement.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerShipment' }
              example:
                id: 80ba23e1-58ae-45d1-ba15-f88fdea1fb52
                status: processing
                card_ids: [838a5e7f-dc62-4618-ad4a-cf015de20536]
                carrier: USPS
                service: Ground Advantage
                service_token: r_9f3c
                cost: 7.5
                cover_amount: null
                insurance_cost: 0
                destination_country: US
                tracking_number: null
                tracking_url: null
                created_at: '2026-11-24T18:20:02.114Z'
                status_updated_at: null
                shipped_at: null
                expected_delivery: null
                delivered_at: null
        '200':
          description: A replay of an earlier request with the same `Idempotency-Key` (`idempotent_replay` is true). Nothing is charged twice.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CustomerShipment'
                  - type: object
                    required: [idempotent_replay]
                    properties:
                      idempotent_replay: { type: boolean, const: true }
        '400':
          description: |-
            - `BAD_IDEMPOTENCY_KEY`: `Idempotency-Key` missing, or not 8-128 characters of `A-Za-z0-9_-`.
            - Any of the refusals of Estimate a customer shipment's `400`.
            - `BAD_RATE`: `rate` isn't the `carrier` and `token` of a rate from the estimate.
            - `BAD_MAX_COST`: `max_cost` is missing, not positive or over 10,000.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: 'max_cost (the most you will pay for this shipment, in dollars, with any cover) is required', code: BAD_MAX_COST }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402':
          description: '`CREDIT_LIMIT`: the postage would take what you owe past your credit limit. The body has `owed`, `credit_limit` and `shipment_total`. Nothing is created or charged.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: This shipment would take your statement past its credit limit., code: CREDIT_LIMIT, owed: 9995, credit_limit: 10000, shipment_total: 7.5 }
        '403': { $ref: '#/components/responses/CustomerShipmentForbidden' }
        '404': { $ref: '#/components/responses/CustomerNotFound' }
        '409':
          description: |-
            Nothing is created or charged.
            - `CARDS_NOT_IN_VAULT`, `CARDS_NOT_SHIPPABLE`: as on the estimate. `CARDS_NOT_SHIPPABLE` is also the answer when a card left the vault while the shipment was being created.
            - `RATE_UNAVAILABLE`: the carrier no longer offers that rate; estimate again.
            - `COVER_UNAVAILABLE`: the chosen service has no cover option; choose another rate or leave `cover_amount` out.
            - `PRICE_CHANGED`: the rate (with any cover) now costs more than `max_cost`. The body has the current `amount` and your `max_cost` (and, with cover, `shipping_cost` and `insurance_premium`).
            - `IDEMPOTENCY_IN_PROGRESS`: a shipment with this key is still being created (`shipment_id`, `started_at`; `needs_review` when it is with our team). Wait, then retry with the same key.
            - `IDEMPOTENCY_RETRY`: an earlier attempt with this key just failed and charged nothing. Retry with the same key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: The rate is now above your max_cost., code: PRICE_CHANGED, amount: 7.95, max_cost: 7.5 }
        '422': { $ref: '#/components/responses/ShipmentKeyReused' }
        '429':
          description: |-
            - `RATE_LIMITED`: too many requests from this key; wait `retry_after_seconds`.
            - `DAILY_SHIPMENT_LIMIT_REACHED`: this key has created 50 shipments this UTC day. The body has `limit` and `resets_at`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: 'Daily shipment limit reached: 50 per key per UTC day.', code: DAILY_SHIPMENT_LIMIT_REACHED, limit: 50, resets_at: '2026-11-25T00:00:00.000Z' }
        '500':
          description: |-
            - `SHIPMENT_OUTCOME_UNKNOWN`: we couldn't confirm whether the shipment went through; it is with our team (`shipment_id`, `needs_review`). Retrying with the same `Idempotency-Key` is safe and never charges twice. Don't resend under a new key.
            - No `code`: our fault; retry with the same `Idempotency-Key`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: 'We could not confirm whether this shipment went through. It is with our team; retrying with the same Idempotency-Key is safe and will not charge again.', code: SHIPMENT_OUTCOME_UNKNOWN, shipment_id: 80ba23e1-58ae-45d1-ba15-f88fdea1fb52, needs_review: true }
        '502':
          description: We couldn't confirm the carrier rate (no `code`). Nothing was charged; retry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Could not confirm the carrier rate. Please try again. }
        '503':
          description: |-
            - `SHIPMENT_NOT_CREATED`: the shipment didn't go through and its postage is being taken off your statement (`needs_review`).
            - No `code`: the shipment didn't go through and nothing was charged, or we couldn't run a check; retry with the same `Idempotency-Key`. Or `AUTH_UNAVAILABLE`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: The shipment did not go through and nothing was charged. Please try again. }
    get:
      tags: [Customers]
      operationId: listCustomerShipments
      summary: List a customer's shipments
      description: |-
        **non-crypto programs only.** [Non-crypto model](/partner-api/v2/settlement).

        The customer's latest 100 shipments, newest first, each with its status and tracking. Never the address.
      parameters:
        - $ref: '#/components/parameters/Customer'
      responses:
        '200':
          description: The shipments.
          content:
            application/json:
              schema:
                type: object
                required: [customer, shipments]
                properties:
                  customer: { type: string, description: 'The `customer` you asked for.' }
                  shipments:
                    type: array
                    maxItems: 100
                    items: { $ref: '#/components/schemas/CustomerShipment' }
              example:
                customer: user-1842
                shipments:
                  - id: 80ba23e1-58ae-45d1-ba15-f88fdea1fb52
                    status: shipped
                    card_ids: [838a5e7f-dc62-4618-ad4a-cf015de20536]
                    carrier: USPS
                    service: Ground Advantage
                    service_token: r_9f3c
                    cost: 7.5
                    cover_amount: null
                    insurance_cost: 0
                    destination_country: US
                    tracking_number: '9400111899223344556677'
                    tracking_url: 'https://tools.usps.com/go/TrackConfirmAction?tRef=fullpage&tLc=2&text28777=&tLabels=9400111899223344556677'
                    created_at: '2026-11-24T18:20:02.114Z'
                    status_updated_at: '2026-11-25T15:02:40.000Z'
                    shipped_at: '2026-11-25T15:02:40.000Z'
                    expected_delivery: '2026-11-28'
                    delivered_at: null
        '400': { $ref: '#/components/responses/CustomerBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/CustomerNotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /api/partner/v2/webhooks:
    post:
      tags: [Webhooks]
      operationId: registerWebhook
      summary: Register a webhook
      description: |-
        One webhook per key. The first call registers it and answers `201` with the signing secret: **the secret is shown once; store it.** Calling again changes the URL and answers `200` with `secret: null` (the secret stays the same). To get a new secret, delete the webhook and register again.

        The URL must be a public `https://` URL on port 443, with a hostname (not an IP address) and no login in it, up to 2048 characters. The sandbox has the same rule. Events: `nft_order.updated`, `sellback.updated`, `nft_shipment.updated`, and `ping` from Test a webhook.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri, maxLength: 2048, description: 'A public `https://` URL.' }
            example: { url: https://partner.example.com/catchback/webhooks }
      responses:
        '201':
          description: Registered. `secret` is shown this once.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterWebhookResponse' }
              example:
                webhook:
                  id: c2f0e8b4-1a7d-4c39-9e55-0b6d3a8f2e17
                  url: https://partner.example.com/catchback/webhooks
                  enabled: true
                  created_at: '2026-11-17T10:00:00.000Z'
                  updated_at: '2026-11-17T10:00:00.000Z'
                secret: whsec_3f9a...
        '200':
          description: The URL changed. `secret` is null; the secret is unchanged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterWebhookResponse' }
              example:
                webhook:
                  id: c2f0e8b4-1a7d-4c39-9e55-0b6d3a8f2e17
                  url: https://partner.example.com/catchback/v2-webhooks
                  enabled: true
                  created_at: '2026-11-17T10:00:00.000Z'
                  updated_at: '2026-11-18T08:30:00.000Z'
                secret: null
        '400':
          description: |-
            - `BAD_JSON`: the body isn't JSON.
            - `INVALID_WEBHOOK_URL`: the URL isn't a public `https://` URL; the message says why.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: The webhook URL must use https., code: INVALID_WEBHOOK_URL }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |-
            - `KEY_ROTATED`: this key has been rotated; register the webhook with the new key.
            - `WEBHOOK_ACCOUNT_CHANGED`: this key's webhook was registered under an earlier setup of your program; delete it and register again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: This key has been rotated; register the webhook with the new key., code: KEY_ROTATED }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/WebhooksUnavailable' }
    get:
      tags: [Webhooks]
      operationId: listWebhooks
      summary: List webhooks
      description: This key's webhook, as a list of at most one (empty when none is set). The secret is never returned again.
      responses:
        '200':
          description: The webhook, if any.
          content:
            application/json:
              schema:
                type: object
                required: [webhooks]
                properties:
                  webhooks:
                    type: array
                    maxItems: 1
                    items: { $ref: '#/components/schemas/Webhook' }
              example:
                webhooks:
                  - id: c2f0e8b4-1a7d-4c39-9e55-0b6d3a8f2e17
                    url: https://partner.example.com/catchback/webhooks
                    enabled: true
                    created_at: '2026-11-17T10:00:00.000Z'
                    updated_at: '2026-11-17T10:00:00.000Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/WebhooksUnavailable' }
  /api/partner/v2/webhooks/{id}:
    delete:
      tags: [Webhooks]
      operationId: deleteWebhook
      summary: Delete a webhook
      description: Removes the webhook and its secret, and stops every event not yet delivered.
      parameters:
        - $ref: '#/components/parameters/WebhookId'
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: boolean, const: true }
              example: { deleted: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/UnknownWebhook' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/WebhooksUnavailable' }
  /api/partner/v2/webhooks/{id}/test:
    post:
      tags: [Webhooks]
      operationId: testWebhook
      summary: Test a webhook
      description: |-
        Sends one signed `ping` event to your URL right now, with no retry, and answers how your receiver responded. On a failure `delivered` is false, `response_status` is your status code (or null) and `error` a short reason. No body.
      parameters:
        - $ref: '#/components/parameters/WebhookId'
      responses:
        '200':
          description: How your receiver responded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookTestResult' }
              examples:
                delivered:
                  summary: Delivered
                  value: { event_id: evt_9c1d4e7a2b5f8c0d3e6a9b1c4d7e0f23, delivered: true, response_status: 200, error: null }
                failed:
                  summary: Your receiver answered 500
                  value: { event_id: evt_1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d, delivered: false, response_status: 500, error: http_500 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/UnknownWebhook' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/WebhooksUnavailable' }
  /api/partner/v2/revenue:
    get:
      tags: [Revenue]
      operationId: getRevenue
      summary: Get your revenue statement
      description: |-
        Your revenue share, month by month: one month with `period`, or the last 12 months (newest first) without it. A sale counts in the month it was paid; a refund in the month it was refunded. Amounts in USD. The standard share is 3% of every pack opening. Premier partners earn more. `share_pct` is the rate that applies to you.
      parameters:
        - name: period
          in: query
          description: One month, `YYYY-MM`.
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
          example: 2026-11
      responses:
        '200':
          description: The statement.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevenueStatement' }
              example:
                program: okx
                currency: USD
                months:
                  - period: 2026-11
                    orders: 412
                    gmv: 18250
                    share_pct: 3
                    share_amount: 547.5
                    refunds: { count: 3, gmv: 125, share_amount: 3.75 }
                    net_gmv: 18125
                    net_share: 543.75
                    payout: { status: open, amount: null, reference: null, paid_at: null }
        '400':
          description: '`BAD_PERIOD`: `period` isn''t `YYYY-MM`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: period must be YYYY-MM, code: BAD_PERIOD }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /api/partner/v2/settlement:
    get:
      tags: [Settlement]
      operationId: getSettlement
      summary: Get your statement
      description: |-
        **non-crypto programs only.** [Non-crypto model](/partner-api/v2/settlement).

        What you owe now against your credit limit, your daily limits, and one UTC month of your statement (`period`, the current month by default): what was owed at its start and end, a total per kind, and its entries, newest first, each naming the customer by your own id. A positive `amount` adds to what you owe; a negative one takes from it. Page the entries with `limit` and `cursor`. Your revenue share is netted on the statement.
      parameters:
        - name: period
          in: query
          description: 'One month, `YYYY-MM` (UTC). Default: the current month.'
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
          example: 2026-11
        - name: limit
          in: query
          description: Entries per page, 1-100.
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: The statement.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettlementStatement' }
              example:
                owed: 236.65
                credit_limit: 10000
                available: 9763.35
                customer_daily_limit: 500
                daily_limit: null
                period:
                  month: 2026-11
                  from: '2026-11-01T00:00:00.000Z'
                  to: '2026-12-01T00:00:00.000Z'
                  opening_balance: 0
                  closing_balance: 236.65
                  totals:
                    order: { amount: 250, entries: 10 }
                    sellback: { amount: -31, entries: 1 }
                    shipping: { amount: 17.65, entries: 2 }
                entries:
                  - { id: 4f6a2b1c-3d5e-4f70-8a9b-0c1d2e3f4a5b, kind: shipping, amount: 7.5, created_at: '2026-11-24T18:20:02.301Z', customer: user-1842, order_id: null, shipment_id: 80ba23e1-58ae-45d1-ba15-f88fdea1fb52 }
                  - { id: 2e8c4d6f-1a3b-4c5d-9e7f-8a9b0c1d2e3f, kind: sellback, amount: -31, created_at: '2026-11-24T18:11:40.902Z', customer: user-1842, order_id: null, card_id: 838a5e7f-dc62-4618-ad4a-cf015de20536, sellback_id: 5b1e2c3d-4f5a-4b6c-8d7e-9f0a1b2c3d4e }
                  - { id: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d, kind: order, amount: 25, created_at: '2026-11-24T18:02:10.884Z', customer: user-1842, order_id: 9c4e1a7b-2d3f-4e5a-8b6c-0d1e2f3a4b5c }
                next_cursor: null
        '400':
          description: |-
            - `NOT_PARTNER_SETTLED`: your program pays through customer wallets and has no statement; see Get your revenue statement.
            - `BAD_PERIOD`: `period` isn't a `YYYY-MM` month.
            - `BAD_LIMIT`: `limit` isn't 1-100.
            - `BAD_CURSOR`: `cursor` isn't a `next_cursor` this endpoint returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: period must be a month as YYYY-MM, code: BAD_PERIOD }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /api/partner/v2/keys:
    get:
      tags: [Keys]
      operationId: getKey
      summary: Get your key
      description: |-
        The key you call with. Never a secret. `expires_at` is set once the key has been rotated (when it stops working); `successor` is then the key that replaced it; `rotated_from` is the key this one replaced. `payment_mode` says how your program is paid: `wallet` (customers pay from their own wallets) or `partner` (Non-crypto model: use `customer` and the `Customers` operations).
      responses:
        '200':
          description: The key.
          content:
            application/json:
              schema:
                type: object
                required: [key]
                properties:
                  key: { $ref: '#/components/schemas/Key' }
              example:
                key:
                  id: c2f0e8b4-1a7d-4c39-9e55-0b6d3a8f2e17
                  name: okx-prod
                  scopes: ['nft:orders']
                  created_at: '2026-11-16T12:00:00.000Z'
                  last_used_at: '2026-11-17T09:58:12.000Z'
                  expires_at: null
                  rotated_from: null
                  successor: null
                  program: okx
                  payment_mode: wallet
        '401': { $ref: '#/components/responses/InvalidKey' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /api/partner/v2/keys/rotate:
    post:
      tags: [Keys]
      operationId: rotateKey
      summary: Rotate your key
      description: |-
        Issues a new key for the same program, with the same scopes. No body. **Store `key.secret` straight away.**

        - The old key keeps working for 24 hours (`previous_key.expires_at`), then answers `401`.
        - If the response is lost, call again with the same old key and the same `Idempotency-Key` within 10 minutes, before you use the new key: you get the same new key and secret back (`200`, `idempotent_replay: true`). After that the replay is `409` `ALREADY_ROTATED`.
        - A key is rotated once; rotate the new key next time.
        - Your webhook moves to the new key (same URL, same secret), and the old key's stops.
      parameters:
        - $ref: '#/components/parameters/RotateIdempotencyKey'
      responses:
        '201':
          description: The new key, with its secret.
          headers:
            Cache-Control:
              description: '`no-store`.'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RotateKeyResponse' }
              example:
                key: { id: 9a41d7e2-3b5c-4d6e-8f0a-1b2c3d4e5f60, name: okx-prod-r2, secret: cb_live_7c1e..., created_at: '2026-11-17T10:00:00.000Z' }
                previous_key: { id: c2f0e8b4-1a7d-4c39-9e55-0b6d3a8f2e17, expires_at: '2026-11-18T10:00:00.000Z' }
        '200':
          description: A replay within 10 minutes, before the new key was used (`idempotent_replay` is true). Same key, same secret.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RotateKeyResponse' }
        '400':
          description: '`BAD_IDEMPOTENCY_KEY`: `Idempotency-Key` missing, or not 8-128 characters of `A-Za-z0-9_-`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: 'Idempotency-Key must be 8-128 characters of A-Z, a-z, 0-9, _ or -.', code: BAD_IDEMPOTENCY_KEY }
        '401': { $ref: '#/components/responses/InvalidKey' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: '`ALREADY_ROTATED`: this key was already rotated with a different `Idempotency-Key`, or the replay window has passed. The body has `successor` (`id`, `name`) and `expires_at`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error: This key was already rotated. Use its successor, or retry with the original Idempotency-Key.
                code: ALREADY_ROTATED
                successor: { id: 9a41d7e2-3b5c-4d6e-8f0a-1b2c3d4e5f60, name: okx-prod-r2 }
                expires_at: '2026-11-18T10:00:00.000Z'
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /api/partner/v2/keys/revoke-previous:
    post:
      tags: [Keys]
      operationId: revokePreviousKey
      summary: Revoke the previous key
      description: |-
        Call it with the **new** key once every server uses it. The key it replaced stops working immediately instead of at the end of the 24 hours, and its webhook stops with it. Do this whenever you rotate because a key may have leaked. No body.
      responses:
        '200':
          description: The previous key is revoked.
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked:
                    type: object
                    required: [id, at]
                    properties:
                      id: { type: string, format: uuid, description: 'The key this one replaced.' }
                      at: { type: string, format: date-time }
              example: { revoked: { id: c2f0e8b4-1a7d-4c39-9e55-0b6d3a8f2e17, at: '2026-11-17T10:05:00.000Z' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: '`NO_PREVIOUS_KEY`: this key didn''t replace another key.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: This key did not replace another key., code: NO_PREVIOUS_KEY }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /api/partner/v2/sandbox/payments/{intentId}:
    post:
      tags: [Sandbox]
      operationId: sandboxPay
      summary: Simulate a payment
      description: |-
        **Sandbox only: `404` in production.**

        Pays an order's, a multi-pack order's, a shipment's or a multi-token shipment's sandbox Payment Intent, exactly as a settled payment would, then delivers any webhooks it produced. Paying twice changes nothing.

        The response's `status` is the order's or shipment's status after the payment (with the same value as `order_status` or `shipment_status`), and `webhooks` counts the deliveries this call made. An order's pack opens as its payment settles, so an order usually answers `rolled`, not `paid` (or `refund_due` if the pack couldn't open or `amount` was more than 1% short); then call Run the background work until it is `minted`. A shipment answers `ready`, or stays `awaiting_payment` if `amount` was short.
      parameters:
        - name: intentId
          in: path
          required: true
          description: The `payment.intent_id` from the create response. Sandbox intent ids start `sbx_pi_`.
          schema: { type: string }
          example: sbx_pi_01JD4X7Q2M9N
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                amount: { type: number, exclusiveMinimum: 0, description: 'Dollars paid. Default: the full amount. Send less to test the 1% tolerance and an `underpaid` refund.' }
            example: { amount: 25 }
      responses:
        '200':
          description: Paid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxPaymentResult' }
              examples:
                order:
                  summary: An order
                  value: { paid: true, kind: order, status: rolled, order_status: rolled, webhooks: { delivered: 1, retrying: 0 } }
                shipment:
                  summary: A shipment
                  value: { paid: true, kind: shipment, status: ready, shipment_status: ready, webhooks: { delivered: 1, retrying: 0 } }
        '400':
          description: '`BAD_AMOUNT`: `amount` is not a positive number.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: amount must be a positive number of USD, code: BAD_AMOUNT }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: |-
            - `UNKNOWN_PAYMENT`: no such payment in your program.
            - No code (`Not found`): not the sandbox.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Unknown payment, code: UNKNOWN_PAYMENT }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /api/partner/v2/sandbox/tick:
    post:
      tags: [Sandbox]
      operationId: sandboxTick
      summary: Run the background work
      description: |-
        **Sandbox only: `404` in production.**

        Runs one pass of what production does every two minutes (open paid packs, mint, confirm mints, watch the chain for transfers and burns, pay out, create shipments, close lapsed multi-token shipments, expire unpaid orders), then delivers the webhooks those steps produced. No body. Call it between the steps of a flow instead of waiting.
      responses:
        '200':
          description: The pass ran.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxTickResult' }
              example: { ran: true, errors: 0, webhooks: { delivered: 2, retrying: 0 } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotSandbox' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '502':
          description: The pass didn't run (`ran` is false). Retry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxTickResult' }
              example: { ran: false, errors: 0, webhooks: { delivered: 0, retrying: 0 } }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /api/partner/v2/sandbox/shipments/{id}:
    post:
      tags: [Sandbox]
      operationId: sandboxShip
      summary: Mark a shipment shipped or delivered
      description: |-
        **Sandbox only: `404` in production.**

        Plays our shipping team, so you can build and test your tracking screens. `shipped` marks a burned shipment shipped, with a test USPS tracking number, a tracking link, `shipped_at` and an `expected_delivery` three days out; `delivered` then sets `delivered_at`. Read the result with Get a shipment. It also delivers any webhooks the change produced.

        On a non-crypto program, `{id}` is a customer shipment's `id` from Create a customer shipment (there is nothing to burn); read the result with List a customer's shipments.
      parameters:
        - name: id
          in: path
          required: true
          description: A `shipment_id` (a UUID) or any token's `quote_id` (`0x` + 64 hex). On a non-crypto program, a customer shipment's `id` (a UUID).
          schema: { type: string, pattern: '^(0x[0-9a-f]{64}|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$' }
          example: 7e2a91c4-5b0d-4f3e-8a6c-1d9b0e2f4a73
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [shipped, delivered] }
            example: { status: shipped }
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema:
                type: object
                required: [ok, status, webhooks]
                properties:
                  ok: { type: boolean, const: true }
                  status: { type: string, enum: [shipped, delivered], description: 'The status you set.' }
                  webhooks: { $ref: '#/components/schemas/SandboxWebhookDeliveries' }
              example: { ok: true, status: shipped, webhooks: { delivered: 1, retrying: 0 } }
        '400':
          description: '`status` isn''t `shipped` or `delivered` (no `code`).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "status must be 'shipped' or 'delivered'" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: |-
            - `UNKNOWN_SHIPMENT`: no such shipment in your program.
            - No code (`Not found`): not the sandbox.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Unknown shipment, code: UNKNOWN_SHIPMENT }
        '409':
          description: |-
            - `NOT_BURNED`: the shipment has no shipping order yet: burn every token, then tick.
            - `NOT_CREATED`: non-crypto program: that customer shipment was never created (it was refused, or is still being created).
            - `BAD_TRANSITION`: a shipment only moves `processing` → `shipped` → `delivered`; `current_status` says where it is. Sending the status it already has changes nothing and answers `200`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: 'No shipping order for this shipment yet: burn it and tick first', code: NOT_BURNED }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /api/partner-nfts/metadata/{chainId}/{tokenId}:
    get:
      tags: [Metadata]
      operationId: getEvmTokenMetadata
      summary: Token metadata (EVM)
      description: |-
        **No key.** A token's standard NFT metadata: the token's `tokenURI`. Wallets and marketplaces read it from anywhere. It never includes a price or value of any kind. Cached for a few minutes (`Cache-Control: public, s-maxage=300`). A token whose mint hasn't been sent yet answers `404`. A trailing `.json` on the last segment is accepted.
      security:
        - {}
      parameters:
        - name: chainId
          in: path
          required: true
          description: The numeric chain id of your mint chain.
          schema: { type: string, pattern: '^[0-9]{1,12}$' }
          example: '196'
        - name: tokenId
          in: path
          required: true
          description: The decimal `token_id`.
          schema: { type: string, pattern: '^[0-9]{1,78}(\.json)?$' }
          example: '81264573985362058461377125337283195667'
      responses:
        '200': { $ref: '#/components/responses/TokenMetadata' }
        '404': { $ref: '#/components/responses/UnknownMetadataToken' }
        '503': { $ref: '#/components/responses/MetadataUnavailable' }
  /api/partner-nfts/metadata/{id}:
    get:
      tags: [Metadata]
      operationId: getSolanaTokenMetadata
      summary: Token metadata (Solana)
      description: |-
        **No key.** A Solana asset's standard NFT metadata: the asset's `uri`. Same body and rules as the EVM form. `{id}` is our id for the asset (a UUID), as the asset's `uri` names it.
      security:
        - {}
      parameters:
        - name: id
          in: path
          required: true
          description: Our id for the asset.
          schema: { type: string, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}(\.json)?$' }
          example: 4b8e0f2a-91c3-4d5e-87f6-a0b1c2d3e4f5
      responses:
        '200': { $ref: '#/components/responses/TokenMetadata' }
        '404': { $ref: '#/components/responses/UnknownMetadataToken' }
        '503': { $ref: '#/components/responses/MetadataUnavailable' }
webhooks:
  nft_order.updated:
    post:
      tags: [Webhook events]
      operationId: nftOrderUpdatedEvent
      summary: Order updated
      description: |-
        **We send this to your webhook URL.** An order changed status after you created it: `paid`, `rolled`, `minted`, `mint_failed`, `expired`, `refund_due`, `refunded`. `data.order` is the order as Get an order returns it. For a multi-pack order it fires for each unit, carrying the order's `order_id`, its `batch_id` and the `unit` number.

        The payload is the current state, not a diff: several quick changes can arrive as one event with the latest status, and an intermediate status may never be sent on its own. Setup, signatures and retries: [Webhooks](/partner-api/v2/webhooks).
      security:
        - {}
      parameters:
        - $ref: '#/components/parameters/WebhookSignature'
        - $ref: '#/components/parameters/WebhookEvent'
        - $ref: '#/components/parameters/WebhookEventId'
        - $ref: '#/components/parameters/WebhookAttempt'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/WebhookEnvelope'
                - type: object
                  properties:
                    type: { const: nft_order.updated }
                    data:
                      type: object
                      required: [order]
                      properties:
                        order: { $ref: '#/components/schemas/OrderOrUnit' }
            example:
              id: evt_4b8e0f2a91c3d5e7f6a0b1c2d3e4f5a6
              type: nft_order.updated
              created_at: '2026-11-16T18:04:52.118Z'
              data:
                order:
                  order_id: okx-ord-7f3a9c21
                  id: 3d2b8f0e-6c1a-4f7e-9a51-2b0d8c4e7f13
                  status: minted
                  pack_type: bronze
                  category: pokemon
                  odds: standard
                  price: 25
                  recipient: 0x8f3c...e21a
                  mint_chain: 'evm:196'
                  paid_at: '2026-11-16T18:04:40.002Z'
                  custody: wallet
                  pull: { card_id: a1c4e2f8-7b3d-4c5e-9f1a-2b3c4d5e6f70, category: pokemon, name: Charizard ex 199/165 PSA 10, value: 412.5, pulled_at: '2026-11-16T18:04:41.317Z' }
                  token: { chain: 'evm:196', contract: 0x7b1e...c0de, token_id: '81264573985362058461377125337283195667', status: confirmed, tx: 0x9f2a... }
                  failure_reason: null
                  created_at: '2026-11-16T18:02:11.420Z'
      responses:
        '200': { $ref: '#/components/responses/WebhookAck' }
  sellback.updated:
    post:
      tags: [Webhook events]
      operationId: sellbackUpdatedEvent
      summary: Sell-back updated
      description: |-
        **We send this to your webhook URL.** Crypto Wallet model: a sell-back payout changed status: `pending` (the burn was seen), `sending`, `sent`, `held`, `failed`; `data.quote` is the quote as Get a sell-back quote returns it. Non-crypto model: a customer's card was sold back and its payout credited to your statement; `data.sellback` is that credit (`status: credited`). Setup, signatures and retries: [Webhooks](/partner-api/v2/webhooks).
      security:
        - {}
      parameters:
        - $ref: '#/components/parameters/WebhookSignature'
        - $ref: '#/components/parameters/WebhookEvent'
        - $ref: '#/components/parameters/WebhookEventId'
        - $ref: '#/components/parameters/WebhookAttempt'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/WebhookEnvelope'
                - type: object
                  properties:
                    type: { const: sellback.updated }
                    data:
                      oneOf:
                        - type: object
                          description: Crypto Wallet model.
                          required: [quote]
                          properties:
                            quote: { $ref: '#/components/schemas/SellbackQuoteStatus' }
                        - type: object
                          description: Non-crypto model.
                          required: [sellback]
                          properties:
                            sellback: { $ref: '#/components/schemas/SettledSellbackCredit' }
            example:
              id: evt_7d1c3a5e9b2f4c6e8a0d1b3c5e7f9a12
              type: sellback.updated
              created_at: '2026-11-16T18:23:40.551Z'
              data:
                quote:
                  quote_id: 0x5e0c...91ab
                  status: redeemed
                  amount_usd: 330
                  holder: 0x8f3c...e21a
                  payout: { chain: 'evm:8453', address: 0x8f3c...e21a, status: sent, tx_hash: 0x77d0..., held: false }
                  expires_at: '2026-11-16T18:30:00.000Z'
                  redeemed_at: '2026-11-16T18:21:13.000Z'
                  burn_tx: 0x3be1...
      responses:
        '200': { $ref: '#/components/responses/WebhookAck' }
  nft_shipment.updated:
    post:
      tags: [Webhook events]
      operationId: nftShipmentUpdatedEvent
      summary: Shipment updated
      description: |-
        **We send this to your webhook URL.** A shipment was paid (`ready`), a token was burned (`redeemed`), or the box moved: `fulfilment.status` `pending`, `processing`, `shipped`, `delivered`, `cancelled`, `needs_review`.

        Non-crypto model: a customer shipment was created (`processing`, its first event) or moved (`shipped`, `delivered`, `cancelled`); `data.shipment` is the shipment as List a customer's shipments returns it, plus `customer`.

        Crypto Wallet model: `data.shipment` has the fields of the one-token shape: `quote_id`, `status`, `shipping_cost`, `holder`, `expires_at`, `paid_at`, `burn` and `fulfilment`, plus `shipment_id`: the box's id on a multi-token shipment, else the token's `quote_id`. Each event is about one token (its `quote_id`). When a multi-token box moves (`fulfilment` changes), every token burned into it gets its own event, with the same `shipment_id`, and `shipping_cost` is the whole box's postage. Get a shipment with `shipment_id` or any `quote_id` returns the whole box. On Solana `burn` is null in the event: fetch the GET for a fresh transaction. A burn window lapsing sends no event. Setup, signatures and retries: [Webhooks](/partner-api/v2/webhooks).
      security:
        - {}
      parameters:
        - $ref: '#/components/parameters/WebhookSignature'
        - $ref: '#/components/parameters/WebhookEvent'
        - $ref: '#/components/parameters/WebhookEventId'
        - $ref: '#/components/parameters/WebhookAttempt'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/WebhookEnvelope'
                - type: object
                  properties:
                    type: { const: nft_shipment.updated }
                    data:
                      type: object
                      required: [shipment]
                      properties:
                        shipment:
                          oneOf:
                            - allOf:
                                - $ref: '#/components/schemas/TokenShipment'
                                - type: object
                                  description: Crypto Wallet model.
                                  required: [shipment_id]
                                  properties:
                                    shipment_id: { type: string, description: 'The box''s `shipment_id` on a multi-token shipment, else the token''s `quote_id`.' }
                            - allOf:
                                - $ref: '#/components/schemas/CustomerShipment'
                                - type: object
                                  description: Non-crypto model.
                                  required: [customer]
                                  properties:
                                    customer: { $ref: '#/components/schemas/CustomerId' }
            example:
              id: evt_2e4a6c8e0b1d3f5a7c9e1b3d5f7a9c0e
              type: nft_shipment.updated
              created_at: '2026-11-17T16:04:02.010Z'
              data:
                shipment:
                  quote_id: 0xa93f...0c2d
                  shipment_id: 0xa93f...0c2d
                  status: redeemed
                  shipping_cost: 9.85
                  holder: 0x8f3c...e21a
                  expires_at: '2026-11-17T18:41:02.000Z'
                  paid_at: '2026-11-16T18:41:02.000Z'
                  burn: null
                  fulfilment:
                    status: shipped
                    carrier: USPS
                    service: Priority Mail
                    tracking_number: '9400111899223456789012'
                    tracking_url: https://tools.usps.com/go/TrackConfirmAction?tLabels=9400111899223456789012
                    shipped_at: '2026-11-17T16:02:11.000Z'
                    expected_delivery: '2026-11-20'
                    delivered_at: null
                    created_at: '2026-11-16T19:05:30.000Z'
      responses:
        '200': { $ref: '#/components/responses/WebhookAck' }
  ping:
    post:
      tags: [Webhook events]
      operationId: pingEvent
      summary: Ping
      description: |-
        **We send this to your webhook URL** when you call Test a webhook: once, with no retry. Use it to check your receiver and your signature check.
      security:
        - {}
      parameters:
        - $ref: '#/components/parameters/WebhookSignature'
        - $ref: '#/components/parameters/WebhookEvent'
        - $ref: '#/components/parameters/WebhookEventId'
        - $ref: '#/components/parameters/WebhookAttempt'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/WebhookEnvelope'
                - type: object
                  properties:
                    type: { const: ping }
                    data:
                      type: object
                      required: [webhook_id]
                      properties:
                        webhook_id: { type: string, format: uuid, description: 'The webhook''s `id`.' }
            example:
              id: evt_9c1d4e7a2b5f8c0d3e6a9b1c4d7e0f23
              type: ping
              created_at: '2026-11-17T10:01:00.000Z'
              data: { webhook_id: c2f0e8b4-1a7d-4c39-9e55-0b6d3a8f2e17 }
      responses:
        '200': { $ref: '#/components/responses/WebhookAck' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: cb_live_<48 hex> (production) or cb_test_<48 hex> (sandbox)
      description: 'Your API key, sent as a bearer token, with the scope `nft:orders`. A production key starts `cb_live_` and works only at https://catchbackcards.com; a sandbox key starts `cb_test_` and works only at https://sandbox.catchbackcards.com (production refuses one with `401 SANDBOX_KEY`). Keep it on your servers: never in a browser, app or wallet. Use a separate key per environment. A request from a country on our sanctions list gets a `403` with `Access denied`, whether or not it has a valid key. See [Authentication and keys](/partner-api/v2/authentication).'
  parameters:
    OrderIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Your own order id, 8-128 characters of `A-Za-z0-9_-`, one per order. It becomes the order's `order_id`. Retry a timed-out or `500` call with the same key. The same key with a different request (`pack_type`, `category`, resolved `odds`, `quantity`, `recipient`, `refund_address`, or `customer` on a non-crypto program) is `422`.
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,128}$' }
      example: okx-ord-7f3a9c21
    ShipmentIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Your own shipment id, 8-128 characters of `A-Za-z0-9_-`. Both shipment endpoints share one key space. The same key with a different request (tokens in any order, `holder`, `address`, `rate`, `cover_amount`) is `422`.
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,128}$' }
      example: okx-ship-1c9e04
    RotateIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 8-128 characters of `A-Za-z0-9_-`. Reuse it within 10 minutes to get a lost new key back.
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,128}$' }
      example: okx-rotate-2026-11
    CustomerShipmentIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Your own shipment id, 8-128 characters of `A-Za-z0-9_-`. Retry a timed-out or `5xx` call with the same key. The same key with a different request (`card_ids`, `address`, `rate`, `cover_amount`) is `422`.
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,128}$' }
      example: acme-ship-1c9e04
    Customer:
      name: customer
      in: path
      required: true
      description: Your own id for the customer, as you sent it as `customer` on Create an order. 1-128 characters of `A-Za-z0-9_.:-`; never personal data. Case-sensitive.
      schema: { $ref: '#/components/schemas/CustomerId' }
      example: user-1842
    PackCategory:
      name: category
      in: query
      description: The catalog.
      schema: { $ref: '#/components/schemas/PackCategory' }
    WalletFilter:
      name: wallet
      in: query
      description: A `recipient` address on your mint chain.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      description: Page size, 1-100.
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Cursor:
      name: cursor
      in: query
      description: The `next_cursor` of the previous page, unchanged. Omit for the first page.
      schema: { type: string, maxLength: 400 }
    OrderId:
      name: id
      in: path
      required: true
      description: Our order `id` (a UUID), or the `Idempotency-Key` you sent. A unit's `id` returns that unit.
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,128}$' }
      example: okx-ord-7f3a9c21
    TokenId:
      name: tokenId
      in: path
      required: true
      description: The token's decimal `token_id`, on either chain family. Keep it as a string or bigint, never a JS number.
      schema: { type: string, pattern: '^[0-9]{1,78}$' }
      example: '81264573985362058461377125337283195667'
    ShipmentId:
      name: id
      in: path
      required: true
      description: A `shipment_id` (a UUID), or any token's `quote_id` (`0x` + 64 hex).
      schema: { type: string, pattern: '^(0x[0-9a-f]{64}|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$' }
      example: 7e2a91c4-5b0d-4f3e-8a6c-1d9b0e2f4a73
    WebhookId:
      name: id
      in: path
      required: true
      description: The webhook's `id`. Any other id is `404` `UNKNOWN_WEBHOOK`.
      schema: { type: string, format: uuid }
      example: c2f0e8b4-1a7d-4c39-9e55-0b6d3a8f2e17
    WebhookSignature:
      name: X-CatchBack-Signature
      in: header
      required: true
      description: '`t=<unix seconds>,v1=<hex>`. `v1` is the HMAC-SHA256 of `<t>.<raw request body>`, keyed with your whole secret, `whsec_` included. Compute it over the raw bytes before any JSON parsing, compare in constant time, and refuse a `t` more than 300 seconds from your clock. Each retry is signed afresh.'
      schema: { type: string }
      example: t=1795370692,v1=d93da821be64a143bbacb3c0e47e37a90f72c6747b8b9bc3571abf03fcabf66c
    WebhookEvent:
      name: X-CatchBack-Event
      in: header
      required: true
      description: The event's `type`.
      schema: { type: string }
    WebhookEventId:
      name: X-CatchBack-Event-Id
      in: header
      required: true
      description: The event's `id`, which stays the same on every retry. Dedupe on it.
      schema: { type: string }
    WebhookAttempt:
      name: X-CatchBack-Attempt
      in: header
      required: true
      description: Which try this is, from 1 to 8.
      schema: { type: integer, minimum: 1, maximum: 8 }
  headers:
    RetryAfter:
      description: Seconds to wait before retrying.
      schema: { type: integer, minimum: 1 }
  responses:
    Unauthorized:
      description: |-
        - `Missing or malformed API key`: no `Bearer cb_live_…` or `Bearer cb_test_…` header.
        - `This is a sandbox key. Send it to https://sandbox.catchbackcards.com instead.` (code `SANDBOX_KEY`): a `cb_test_` key sent to production.
        - `Invalid API key`: unknown or disabled, or a rotated key past its 24 hours.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Missing or malformed API key }
    InvalidKey:
      description: |-
        - `Missing or malformed API key`, or `Invalid API key`, as on every endpoint.
        - `INVALID_KEY`: the key is disabled, or a rotated key past its 24 hours.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Invalid API key, code: INVALID_KEY }
    Forbidden:
      description: |-
        - `API key lacks required scope: nft:orders`.
        - `NO_PROGRAM`: the key isn't linked to a partner program.
        - `PROGRAM_INACTIVE`: your program is not live.
        - `NOT_AVAILABLE`: wallet orders aren't switched on for your program yet.
        - `Access denied`: a request from a country on our sanctions list.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: This partner program is not live, code: PROGRAM_INACTIVE }
    RateLimited:
      description: '`RATE_LIMITED`: too many requests from this key. Wait `retry_after_seconds`. Limits per key: `POST /orders`, `POST /customers/{customer}/cards/{card_id}/sellback` and `POST /customers/{customer}/shipments` 30 a minute together; the three shipment estimates 30 a minute together; every other endpoint 120 a minute together.'
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Too many requests. Slow down., code: RATE_LIMITED, retry_after_seconds: 23 }
    AuthUnavailable:
      description: '`AUTH_UNAVAILABLE`, or no code: we couldn''t check your key or load your program right now. This never means the key is bad; retry after `Retry-After`.'
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Could not load the partner program; try again. }
    ServerError:
      description: Our fault. Retry with backoff, with the same `Idempotency-Key` where the endpoint takes one.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Something went wrong; retry with the same Idempotency-Key. }
    NotSandbox:
      description: Not the sandbox. Every sandbox endpoint answers this in production.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Not found }
    UnknownTokens:
      description: '`UNKNOWN_TOKEN`: no such token on your program''s contract. On Create a shipment and Estimate a shipment, `token_ids` lists the unknown ones.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Unknown token, code: UNKNOWN_TOKEN, token_ids: ['90311820476190023716442901288201455'] }
    TokensNotLive:
      description: '`TOKEN_NOT_LIVE`: the token isn''t minted yet, or was already burned. On the multi-token endpoints `token_ids` lists them.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: These tokens are not live., code: TOKEN_NOT_LIVE, token_ids: ['90311820476190023716442901288201455'] }
    NotHolderForbidden:
      description: |-
        - `NOT_HOLDER`: that wallet does not hold the token on chain right now. On the multi-token endpoints `token_ids` lists the tokens it doesn't hold.
        - Any of the key and program refusals every endpoint can return.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: 'That wallet does not hold every token: one shipment is for one holder.', code: NOT_HOLDER, token_ids: ['90311820476190023716442901288201455'] }
    ChainUnavailable:
      description: |-
        - `CHAIN_UNAVAILABLE`: we couldn't read a token's owner from the chain; retry shortly.
        - `AUTH_UNAVAILABLE`, or no code: we couldn't check your key or load your program; retry after `Retry-After`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Could not read the token owner; try again shortly., code: CHAIN_UNAVAILABLE }
    ChainOrScreeningUnavailable:
      description: |-
        - `CHAIN_UNAVAILABLE`: we couldn't read a token's owner from the chain; retry shortly with the same `Idempotency-Key`.
        - `SCREENING_UNAVAILABLE`: wallet screening is briefly unavailable; retry shortly with the same `Idempotency-Key`.
        - `AUTH_UNAVAILABLE`, or no code: we couldn't check your key or load your program; retry after `Retry-After`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: This wallet cannot redeem right now., code: SCREENING_UNAVAILABLE }
    ShipmentEstimateBadRequest:
      description: |-
        - `BAD_JSON`: the body isn't JSON.
        - `BAD_TOKEN_IDS`: `token_ids` isn't a list of 1-25 distinct decimal token id strings (Estimate a shipment only).
        - `BAD_HOLDER`: `holder` is not a wallet address on your mint chain.
        - `BAD_ADDRESS`: the shipping address is invalid; `fields` maps each bad field to a message.
        - `BAD_COVER`: `cover_amount` isn't a positive dollar amount with at most two decimals.
        - `COVER_NOT_ALLOWED`: `cover_amount` is outside what the items can be insured for; the body has `order_value`, `min_cover` and `max_cover` (`max_cover` is null when they can't be insured).
        - `NOT_SHIPPABLE`: an item can't ship.
        - `PARTNER_GOODS`: the item is held by its brand partner and can't ship through CatchBack; it can still be sold back.
        - `COUNTRY_NOT_SUPPORTED`: we don't ship to that country.
        - `OVER_CUSTOMS_CAP`: the items are worth more than we can ship internationally.

        A refusal about particular tokens lists them in `token_ids`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Some address fields are invalid., code: BAD_ADDRESS, fields: { phone: phone is required outside the US } }
    ShipmentCreateBadRequest:
      description: |-
        - `BAD_IDEMPOTENCY_KEY`: `Idempotency-Key` missing, or not 8-128 characters of `A-Za-z0-9_-`.
        - `BAD_JSON`: the body isn't JSON.
        - `BAD_TOKEN_IDS`: `token_ids` isn't a list of 1-25 distinct decimal token id strings (Create a shipment only).
        - `BAD_HOLDER`: `holder` is not a wallet address on your mint chain.
        - `BAD_ADDRESS`: the shipping address is invalid; `fields` maps each bad field to a message.
        - `BAD_COVER`: `cover_amount` isn't a positive dollar amount with at most two decimals.
        - `COVER_NOT_ALLOWED`: `cover_amount` is outside what the items can be insured for; the body has `order_value`, `min_cover` and `max_cover`.
        - `BAD_MAX_COST`: `max_cost` missing or not positive.
        - `NOT_SHIPPABLE`, `PARTNER_GOODS`, `COUNTRY_NOT_SUPPORTED`, `OVER_CUSTOMS_CAP`: as on the estimate.

        A refusal about particular tokens lists them in `token_ids`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: 'max_cost (the most the holder will pay for shipping, in dollars) is required', code: BAD_MAX_COST }
    ShipmentCreateForbidden:
      description: |-
        - `NOT_HOLDER`: that wallet does not hold the token(s) on chain right now (`token_ids` on Create a shipment).
        - `WALLET_REFUSED`: the holder failed sanctions screening.
        - Any of the key and program refusals every endpoint can return.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: This wallet cannot redeem right now., code: WALLET_REFUSED }
    ShipmentCreateConflict:
      description: |-
        - `TOKEN_NOT_LIVE`: a token isn't minted yet, or was already burned (`token_ids` lists them on Create a shipment).
        - `TOKEN_IN_SHIPMENT`: a token already has a paid shipment waiting for its burn; `token_ids` lists them (and `quote_id` on the one-token endpoint). Burn or renew that shipment instead.
        - `RATE_UNAVAILABLE`: the carrier no longer offers that rate; estimate again.
        - `COVER_UNAVAILABLE`: the chosen service has no cover option; choose another rate or leave `cover_amount` out.
        - `PRICE_CHANGED`: the shipping cost is now above `max_cost`; the body has the current `amount`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: The shipping cost is now above max_cost., code: PRICE_CHANGED, amount: 10.4 }
    ShipmentKeyReused:
      description: '`IDEMPOTENCY_KEY_REUSED`: the key was already used for a different shipment.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: This Idempotency-Key was already used for a different shipment., code: IDEMPOTENCY_KEY_REUSED }
    CustomerBadRequest:
      description: |-
        - `NOT_PARTNER_SETTLED`: your program pays through customer wallets; use the wallet, token and shipment operations.
        - `BAD_CUSTOMER`: `customer` isn't 1-128 characters of `A-Za-z0-9_.:-`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: 'This program pays through customer wallets: read GET /wallets/{address}/tokens', code: NOT_PARTNER_SETTLED }
    CustomerNotFound:
      description: '`CUSTOMER_NOT_FOUND`: no customer with that id has bought from your program.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: No customer with that id has bought from this program., code: CUSTOMER_NOT_FOUND }
    CustomerShipmentBadRequest:
      description: |-
        - `NOT_PARTNER_SETTLED`: your program pays through customer wallets; ship with the token shipment operations.
        - `BAD_JSON`: the body isn't JSON.
        - `BAD_CUSTOMER`: `customer` isn't 1-128 characters of `A-Za-z0-9_.:-`.
        - `BAD_CARD_IDS`: `card_ids` isn't a list of 1-10 distinct card ids from the vault.
        - `BAD_ADDRESS`: the address is invalid; `fields` maps each bad field to a message.
        - `BAD_COVER`: `cover_amount` isn't a positive dollar amount with at most two decimals.
        - `COVER_NOT_ALLOWED`: `cover_amount` is outside what the cards can be insured for; the body has `order_value`, `min_cover` and `max_cover` (`max_cover` is null when they can't be insured).
        - `PARTNER_GOODS`: an item is held by its brand partner and can't ship through CatchBack; it can still be sold back.
        - `COUNTRY_NOT_SUPPORTED`: we don't ship to that country.
        - `OVER_CUSTOMS_CAP`: the cards are worth more than we can ship internationally.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Invalid address, code: BAD_ADDRESS, fields: { phone: Required for international shipments } }
    CustomerShipmentForbidden:
      description: |-
        - `CUSTOMER_BLOCKED`: this customer may not ship cards (`capability` says which block applies). Don't retry.
        - `CUSTOMER_UNAVAILABLE`: this customer's account is unavailable.
        - Any of the key and program refusals every endpoint can return.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: This customer cannot ship cards., code: CUSTOMER_BLOCKED, capability: withdraw }
    CustomerCardsConflict:
      description: |-
        - `CARDS_NOT_IN_VAULT`: a card isn't in this customer's vault from your program; `card_ids` lists them.
        - `CARDS_NOT_SHIPPABLE`: a card can't ship right now; `cards` lists each with its `reason` (`not_in_vault`, `listed`, `shipping`, `on_hold` or `not_a_card`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Some cards are not in this customer's vault from your program., code: CARDS_NOT_IN_VAULT, card_ids: [838a5e7f-dc62-4618-ad4a-cf015de20536] }
    UnknownShipment:
      description: '`UNKNOWN_SHIPMENT`: no such shipment in your program.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Unknown shipment, code: UNKNOWN_SHIPMENT }
    UnknownWebhook:
      description: '`UNKNOWN_WEBHOOK`: no such webhook on this key.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Unknown webhook, code: UNKNOWN_WEBHOOK }
    WebhooksUnavailable:
      description: |-
        - `WEBHOOKS_UNAVAILABLE`: webhooks aren't available on this server yet.
        - `AUTH_UNAVAILABLE`, or no code: we couldn't check your key or load your program; retry after `Retry-After`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Webhooks are not available on this server yet., code: WEBHOOKS_UNAVAILABLE }
    TokenMetadata:
      description: The token's metadata.
      headers:
        Cache-Control:
          description: '`public, s-maxage=300, stale-while-revalidate=3600`.'
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TokenMetadata' }
          example:
            name: Charizard ex 199/165 (PSA 10)
            description: A physical collectible held in the CatchBack vault. Burn this token to sell it back or have it shipped.
            image: https://...
            external_url: https://catchbackcards.com
            attributes:
              - { trait_type: Category, value: pokemon }
              - { trait_type: Grade, value: PSA 10 }
              - { trait_type: Status, value: Vaulted }
    UnknownMetadataToken:
      description: No such token, or its mint hasn't been sent yet.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Unknown token }
    MetadataUnavailable:
      description: Briefly unavailable; retry shortly.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Unavailable }
    WebhookAck:
      description: Answer any `2xx` within 5 seconds, and do slow work after you've answered. Anything else counts as a failure, including a redirect (we never follow one). We retry after 1 minute, 5 minutes, 30 minutes, 2, 6, 12 and 24 hours, then drop the event after 8 attempts; poll to catch up. Delivery is at-least-once and unordered, so dedupe on `id`.
  schemas:
    Error:
      type: object
      required: [error]
      description: Every error body. `code` is stable where you might branch on it; some errors add the fields below.
      properties:
        error: { type: string, description: 'For people. The text can change, so branch on the status and the `code`.' }
        code:
          description: Machine-readable, where you might branch on it. New codes can be added, so treat an unknown one like a missing one.
          anyOf:
            - $ref: '#/components/schemas/ErrorCode'
            - type: string
        retry_after_seconds: { type: integer, description: 'On `RATE_LIMITED`.' }
        odds:
          description: 'On `BAD_ODDS` when the pack sells other odds: the choices it sells. On `ODDS_UNAVAILABLE` from Create an order: the choice asked for.'
          oneOf:
            - type: array
              items: { $ref: '#/components/schemas/Odds' }
            - $ref: '#/components/schemas/Odds'
        reason: { type: [string, 'null'], description: 'On `PACK_UNAVAILABLE`, why the pack can''t open.' }
        status: { type: string, description: 'On `NOT_PULLED`, the order''s status.' }
        token_ids:
          type: array
          items: { type: string }
          description: On a refusal about particular tokens, the token ids it is about.
        quote_id: { type: string, description: 'On `TOKEN_IN_SHIPMENT` from the one-token endpoint, the shipment waiting for the burn.' }
        fields:
          type: object
          additionalProperties: { type: string }
          description: On `BAD_ADDRESS` from a shipment or estimate, each bad address field and what is wrong with it.
        order_value: { type: number, description: 'On `COVER_NOT_ALLOWED`.' }
        min_cover: { type: number, description: 'On `COVER_NOT_ALLOWED`.' }
        max_cover: { type: [number, 'null'], description: 'On `COVER_NOT_ALLOWED`; null when the items can''t be insured.' }
        amount: { type: number, description: 'On `PRICE_CHANGED`, the current shipping cost.' }
        successor:
          type: object
          description: On `ALREADY_ROTATED`, the key that replaced this one.
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        expires_at: { type: [string, 'null'], format: date-time, description: 'On `ALREADY_ROTATED`, when this key stops working.' }
        owed: { type: number, description: 'On `CREDIT_LIMIT`, what you owe now.' }
        credit_limit: { type: number, description: 'On `CREDIT_LIMIT`, your credit limit.' }
        order_total: { type: number, description: 'On `CREDIT_LIMIT`, `CUSTOMER_DAILY_LIMIT` and `DAILY_LIMIT` from Create an order, the order''s total.' }
        shipment_total: { type: number, description: 'On `CREDIT_LIMIT` from Create a customer shipment, the postage (with any cover).' }
        spent_today: { type: number, description: 'On `CUSTOMER_DAILY_LIMIT` and `DAILY_LIMIT`, what was spent this UTC day.' }
        limit: { type: number, description: 'On `CUSTOMER_DAILY_LIMIT` and `DAILY_LIMIT`, the daily limit in dollars; on `DAILY_SHIPMENT_LIMIT_REACHED`, the shipments allowed a day.' }
        resets_at: { type: string, format: date-time, description: 'On `DAILY_SHIPMENT_LIMIT_REACHED`, the next UTC midnight.' }
        card_ids:
          type: array
          items: { type: string }
          description: On `CARDS_NOT_IN_VAULT`, the cards that aren't in the customer's vault from your program.
        cards:
          type: array
          description: On `CARDS_NOT_SHIPPABLE` from a customer shipment or estimate, each card that can't ship and why.
          items:
            type: object
            required: [card_id, reason]
            properties:
              card_id: { type: string }
              reason: { type: string, enum: [not_in_vault, listed, shipping, on_hold, not_a_card] }
        payout_amount: { type: number, description: 'On `PRICE_CHANGED` from Sell back a customer''s card, the current offer.' }
        payout_rate: { type: [number, 'null'], description: 'On `PRICE_CHANGED` from Sell back a customer''s card, the current rate.' }
        max_cost: { type: number, description: 'On `PRICE_CHANGED` from Create a customer shipment, the `max_cost` you sent.' }
        shipping_cost: { type: number, description: 'On `PRICE_CHANGED` from Create a customer shipment with cover, the postage alone.' }
        insurance_premium: { type: number, description: 'On `PRICE_CHANGED` from Create a customer shipment with cover, the cover''s premium.' }
        shipment_id: { type: string, description: 'On `SHIPMENT_OUTCOME_UNKNOWN` and `IDEMPOTENCY_IN_PROGRESS`, the shipment.' }
        started_at: { type: string, format: date-time, description: 'On `IDEMPOTENCY_IN_PROGRESS`, when that shipment started.' }
        needs_review: { type: boolean, description: 'True when the request is with our team.' }
        capability: { type: string, description: 'On `CUSTOMER_BLOCKED` from a customer shipment or estimate, which block applies.' }
    NextCursor:
      type: [string, 'null']
      description: Pass it back unchanged as `cursor` for the next page. Opaque. Null on the last page.
    ErrorCode:
      type: string
      description: Every `code` v2 returns. Branch on these, never on the message text. `UNKNOWN_TOOL`, `MISSING_ARGUMENT`, `UNKNOWN_ARGUMENT`, `BAD_ARGUMENT`, `MISSING_SCOPE`, `BAD_PATH`, `DOC_NOT_FOUND` and `DOCS_UNAVAILABLE` come only from the MCP server, as a tool result; `UNKNOWN_PROGRAM` only from the public feeds.
