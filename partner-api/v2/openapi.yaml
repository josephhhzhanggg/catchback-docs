  /api/partner/v2/tokens/{tokenId}/quote:
    post:
      tags: [Sell-back]
      operationId: createSellbackQuote
      summary: Create a sell-back quote
      description: |-
        A quote fixes the amount, the payer and the payout destination, and expires 10 minutes after it is issued, or when the 5-minute fresh window ends if the quote is at the fresh rate (whichever is sooner). Every call issues a new quote; an unused quote just expires. Takes no `Idempotency-Key`.

        - **EVM** (`family: "evm"`): the holder's wallet calls `burnWithQuote(quote, signature)` on `contract`, passing `quote` exactly as returned. `tokenId`, `amount` (USDC, 6 decimals) and `expiresAt` (unix seconds) are decimal strings.
        - **Solana** (`family: "solana"`): `transaction` moves the asset to `vault` with the quote id as a memo; the holder signs and sends it unchanged before `last_valid_block_height` and `expires_at`.

        Follow the payout with Get a sell-back quote or the `sellback.updated` webhook. [Sell-back](/partner-api/v2/sell-back).
      parameters:
        - $ref: '#/components/parameters/TokenId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SellbackQuoteRequest' }
            example: { kind: sellback, holder: 0x8f3c...e21a, payout_chain: 'evm:8453', payout_address: 0x8f3c...e21a }
      responses:
        '201':
          description: The quote to burn with.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SellbackQuote' }
              examples:
                evm:
                  summary: EVM program
                  value:
                    quote_id: 0x5e0c...91ab
                    chain: 'evm:196'
                    amount_usd: 330
                    expires_at: '2026-11-16T18:30:00.000Z'
                    payout: { chain: 'evm:8453', address: 0x8f3c...e21a }
                    family: evm
                    contract: 0x7b1e...c0de
                    quote:
                      tokenId: '81264573985362058461377125337283195667'
                      kind: 1
                      quoteId: 0x5e0c...91ab
                      holder: 0x8f3c...e21a
                      payoutHash: 0x2c71...
                      amount: '330000000'
                      expiresAt: '1795372200'
                    signature: 0x4a1f...1b
                solana:
                  summary: Solana program
                  value:
                    quote_id: 0x5e0c...91ab
                    chain: 'solana:mainnet'
                    amount_usd: 330
                    expires_at: '2026-11-16T18:30:00.000Z'
                    payout: { chain: 'evm:8453', address: 0x8f3c...e21a }
                    family: solana
                    collection: CoLL...
                    asset: AsSt...
                    vault: VauL...
                    transaction: <base64 unsigned transaction>
                    last_valid_block_height: 312345678
        '400':
          description: |-
            - `BAD_JSON`: the body isn't JSON.
            - `BAD_HOLDER`: `holder` is not a wallet address on your mint chain.
            - `PAYOUT_CHAIN_NOT_SUPPORTED`: `payout_chain` is not `evm:8453` or `solana:mainnet`.
            - `PAYOUT_CHAIN_NOT_ENABLED`: payouts on that chain aren't switched on yet (today: `solana:mainnet`); send `payout_chain: "evm:8453"` with a Base `payout_address`.
            - `BAD_PAYOUT_ADDRESS`: no usable `payout_address` for the payout chain (required when it isn't your mint chain's family).
            - `USE_SHIPMENT_ENDPOINT`: `kind: "shipment"`; shipments start at Create a shipment.
            - No code: `kind` other than `sellback`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: 'Payouts on solana:mainnet are not switched on yet.', code: PAYOUT_CHAIN_NOT_ENABLED }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: |-
            - `NOT_HOLDER`: that wallet does not hold the token on chain right now.
            - `WALLET_REFUSED`: the holder or the payout address failed sanctions screening.
            - Any of the key and program refusals every endpoint can return.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: That wallet does not hold this token., code: NOT_HOLDER }
        '404':
          description: '`UNKNOWN_TOKEN`: no such token on your program''s contract.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Unknown token, code: UNKNOWN_TOKEN }
        '409':
          description: |-
            - `TOKEN_NOT_MINTED`: the token's mint hasn't confirmed yet.
            - `TOKEN_BURNED`: the token was already sold back or shipped.
            - `NO_OFFER`: the item has no sell-back offer right now.
            - No code: your program has no contract yet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: This token has already been redeemed., code: TOKEN_BURNED }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503':
          description: |-
            - `CHAIN_UNAVAILABLE`: we couldn't read the token's owner from the chain; retry shortly.
            - `SCREENING_UNAVAILABLE`: wallet screening is briefly unavailable; retry shortly.
            - `AUTH_UNAVAILABLE`, or no code: we couldn't check your key or load your program; retry after `Retry-After`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Could not read the token owner; try again shortly., code: CHAIN_UNAVAILABLE }
  /api/partner/v2/tokens/{tokenId}/burn:
    post:
      tags: [Sell-back]
      operationId: relayBurn
      summary: Burn without gas
      description: |-
        EVM only. The holder signs the quote (EIP-712, the same domain and `Quote` type the contract checks) instead of sending a transaction, and we send `burnWithQuoteFor(quote, signature, holderSignature)` and pay its gas. Works for a sell-back quote and for each token's `burn` in a paid shipment; the payout or shipment follows as for a burn the holder sent. ERC-1271 wallets can sign.

        The signature authorizes only that quote, once, and is checked on chain. We simulate the burn before sending it, so a refusal sends nothing. A repeat call for the same quote returns the first `tx_hash` and sends nothing (`RELAY_IN_PROGRESS` while that send is in flight). [Sell-back](/partner-api/v2/sell-back#evm-without-gas).
      parameters:
        - $ref: '#/components/parameters/TokenId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quote_id, holder_signature]
              properties:
                quote_id: { type: string, description: 'A sell-back `quote_id`, or the token''s `quote_id` in a paid shipment.' }
                holder_signature: { type: string, description: 'The holder''s EIP-712 signature over the quote exactly as returned, `0x` hex.' }
            example: { quote_id: 0x5e0c...91ab, holder_signature: 0x9b2e...1c }
      responses:
        '202':
          description: The burn is sent, not yet final. Follow the quote or the shipment as usual.
          content:
            application/json:
              schema:
                type: object
                required: [quote_id, tx_hash]
                properties:
                  quote_id: { type: string }
                  tx_hash: { type: string, description: The burn transaction on the mint chain. }
              example: { quote_id: 0x5e0c...91ab, tx_hash: 0x3f8a...d41e }
        '400':
          description: |-
            - `BAD_JSON`: the body isn't JSON.
            - `BAD_QUOTE_ID`: `quote_id` is missing.
            - `BAD_HOLDER_SIGNATURE`: `holder_signature` isn't hex, or isn't the holder's signature over this quote.
            - `RELAY_NOT_SUPPORTED`: a Solana program; sign the quote's transaction instead.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "holder_signature is not the holder's signature over this quote.", code: BAD_HOLDER_SIGNATURE }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: |-
            - `NOT_HOLDER`: the token moved after the quote.
            - Any of the key and program refusals every endpoint can return.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: The quote holder no longer holds this token., code: NOT_HOLDER }
        '404':
          description: |-
            - `UNKNOWN_TOKEN`: no such token on your program's contract.
            - `UNKNOWN_QUOTE`: no such quote for this token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: No such quote for this token., code: UNKNOWN_QUOTE }
        '409':
          description: |-
            - `TOKEN_BURNED`: the token was already sold back or shipped.
            - `QUOTE_USED`: this quote was already burned with.
            - `QUOTE_EXPIRED`: get a new quote, or renew the shipment.
            - `NOT_PAID`: the shipment's shipping isn't paid yet.
            - `QUOTE_NOT_RELAYABLE`: the quote was issued before this endpoint existed; get a new one.
            - `RELAY_IN_PROGRESS`: the first send for this quote is still in flight; follow the quote.
            - No code: your program has no contract yet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: This quote has expired; request a new one., code: QUOTE_EXPIRED }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '502':
          description: '`CHAIN_REFUSED`: the chain refused the burn; nothing was burned.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: The chain refused this burn; nothing was burned., code: CHAIN_REFUSED }
        '503':
          description: |-
            - `CONTRACT_PAUSED`: burns are paused by CatchBack; retry later.
            - `AUTH_UNAVAILABLE`, or no code: we couldn't check your key or load your program; retry after `Retry-After`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Redemptions are paused; try again later., code: CONTRACT_PAUSED }
  /api/partner/v2/quotes:
    get:
      tags: [Sell-back]
      operationId: listSellbackQuotes
      summary: List sell-back quotes
      description: Your sell-back quotes, newest first, each in the Get a sell-back quote shape.
      parameters:
        - name: wallet
          in: query
          description: The `holder` the quote was issued to, on your mint chain.
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of quotes.
          content:
            application/json:
              schema:
                type: object
                required: [quotes, next_cursor]
                properties:
                  quotes:
                    type: array
                    items: { $ref: '#/components/schemas/SellbackQuoteStatus' }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
              example:
                quotes:
                  - quote_id: 0x5e0c...91ab
                    status: redeemed
                    amount_usd: 330
                    holder: 0x8f3c...e21a
                    payout: { chain: 'evm:8453', address: 0x8f3c...e21a, status: sent, tx_hash: 0x77d0..., held: false }
                    expires_at: '2026-11-16T18:30:00.000Z'
                    redeemed_at: '2026-11-16T18:21:13.000Z'
                    burn_tx: 0x3be1...
                next_cursor: null
        '400':
          description: |-
            - `BAD_CURSOR`: `cursor` isn't a `next_cursor` from a previous page.
            - `BAD_LIMIT`: `limit` isn't 1-100.
            - `BAD_ADDRESS`: `wallet` is not an address on your mint chain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: cursor must be a next_cursor from a previous page, code: BAD_CURSOR }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /api/partner/v2/quotes/{quoteId}:
    get:
      tags: [Sell-back]
      operationId: getSellbackQuote
      summary: Get a sell-back quote
      description: |-
        One sell-back quote and its payout. We count a burn after a few block confirmations (EVM) or finalization (Solana), then pay within minutes; the amount paid is always exactly `amount_usd`. Every payout status change is also sent as a `sellback.updated` webhook.
      parameters:
        - name: quoteId
          in: path
          required: true
          description: The `quote_id` from Create a sell-back quote.
          schema: { type: string, pattern: '^0x[0-9a-f]{64}$' }
          example: '0x5e0c7a3b1d2f4e6a8c0b9d7f5e3a1c2b4d6f8e0a9c7b5d3f1e2a4c6b8d0f91ab'
      responses:
        '200':
          description: The quote.
          content:
            application/json:
              schema:
                type: object
                required: [quote]
                properties:
                  quote: { $ref: '#/components/schemas/SellbackQuoteStatus' }
              example:
                quote:
                  quote_id: 0x5e0c...91ab
                  status: redeemed
                  amount_usd: 330
                  holder: 0x8f3c...e21a
                  payout: { chain: 'evm:8453', address: 0x8f3c...e21a, status: sent, tx_hash: 0x77d0..., held: false }
                  expires_at: '2026-11-16T18:30:00.000Z'
                  redeemed_at: '2026-11-16T18:21:13.000Z'
                  burn_tx: 0x3be1...
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: '`UNKNOWN_QUOTE`: no such sell-back quote in your program.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Unknown quote, code: UNKNOWN_QUOTE }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /api/partner/v2/shipments/estimate:
    post:
      tags: [Shipments]
      operationId: estimateShipment
      summary: Estimate a shipment
      description: |-
        **Rate limit:** 30 a minute, shared with Estimate a one-token shipment.

        Carrier rates to ship 1-25 tokens held by one wallet in one box. Charges nothing and stores nothing. `amount` is the carrier rate; `total` is what the holder pays (the rate plus any cover premium): pass it as `max_cost` when you create the shipment. A refusal about particular tokens lists them in `token_ids`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShipmentEstimateRequest' }
            example:
              token_ids: ['81264573985362058461377125337283195667', '90311820476190023716442901288201455']
              holder: 0x8f3c...e21a
              address: { name: Alice Tester, address1: 1 Market St, address2: null, city: San Francisco, state: CA, zip: '94105', country: US, phone: '4155550100' }
              cover_amount: null
      responses:
        '200':
          description: The rates.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShippingRates' }
              example:
                rates:
                  - { carrier: USPS, service: Priority Mail, token: usps_priority, amount: 9.85, estimated_days: 3, total: 9.85 }
        '400': { $ref: '#/components/responses/ShipmentEstimateBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotHolderForbidden' }
        '404': { $ref: '#/components/responses/UnknownTokens' }
        '409': { $ref: '#/components/responses/TokensNotLive' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/ChainUnavailable' }
  /api/partner/v2/shipments:
    post:
      tags: [Shipments]
      operationId: createShipment
      summary: Create a shipment
      description: |-
        Creates and opens one payment for a shipment of 1-25 tokens held by one wallet, in one box. We re-quote the chosen rate for all the tokens together. Pay it exactly like an order. Once paid, Get a shipment returns a `burn` per token; the box ships once every token is burned, within 24 hours of payment (renew a lapsed window).

        `shipment_id` names the whole box; each token has its own `quote_id`, which it burns with. An unpaid shipment never expires. A replay with the same `Idempotency-Key` returns `payment` again while the shipment is unpaid (`null` once paid). [Shipping](/partner-api/v2/shipping).
      parameters:
        - $ref: '#/components/parameters/ShipmentIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateShipmentRequest' }
            example:
              token_ids: ['81264573985362058461377125337283195667', '90311820476190023716442901288201455']
              holder: 0x8f3c...e21a
              address: { name: Alice Tester, address1: 1 Market St, city: San Francisco, state: CA, zip: '94105', country: US, phone: '4155550100' }
              rate: { carrier: USPS, token: usps_priority }
              max_cost: 9.85
              cover_amount: null
      responses:
        '201':
          description: The shipment and how to pay for it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateShipmentResponse' }
              example:
                shipment:
                  shipment_id: 7e2a91c4-5b0d-4f3e-8a6c-1d9b0e2f4a73
                  status: awaiting_payment
