          schema:
            type: string
            enum: [awaiting_payment, ready, redeemed, expired, partially_redeemed]
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of shipments.
          content:
            application/json:
              schema:
                type: object
                required: [shipments, next_cursor]
