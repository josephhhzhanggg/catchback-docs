  /api/partner/v2/shipments:
    post:
      tags: [Shipments]
      operationId: createShipment
      x-moves-money: true
      summary: Create a shipment
      description: |-
        Creates and opens one payment for a shipment of 1-25 tokens held by one wallet, in one box. We re-quote the chosen rate for all the tokens together. Pay it exactly like an order. Once paid, Get a shipment returns a `burn` per token; the box ships once every token is burned, within 24 hours of payment (renew a lapsed window).

        `shipment_id` names the whole box; each token has its own `quote_id`, which it burns with. An unpaid shipment stays payable: its `expires_at` (24 hours from creation) doesn't apply until it is paid, and paying it starts a fresh 24-hour burn window. A replay with the same `Idempotency-Key` returns `payment` again while the shipment is unpaid (`null` once paid). [Shipping](/partner-api/v2/shipping).
      parameters:
        - $ref: '#/components/parameters/ShipmentIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateShipmentRequest' }
            example:
              token_ids: ['81264573985362058461377125337283195667', '90311820476190023716442901288201455']
              holder: 0x8f3c...e21a
              address: { name: Alice Tester, address1: 1 Market St, city: San Francisco, state: CA, zip: '94105', country: US, phone: '4155550100' }
              rate: { carrier: USPS, token: usps_priority }
              max_cost: 9.85
              cover_amount: null
      responses:
        '201':
          description: The shipment and how to pay for it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateShipmentResponse' }
              example:
                shipment:
                  shipment_id: 7e2a91c4-5b0d-4f3e-8a6c-1d9b0e2f4a73
                  status: awaiting_payment
                  shipping_cost: 9.85
                  holder: 0x8f3c...e21a
                  expires_at: '2026-11-17T18:40:00.000Z'
                  paid_at: null
                  tokens:
                    - { token_id: '90311820476190023716442901288201455', quote_id: 0x1b7c...e4a0, status: awaiting_payment, burned_at: null, burn_tx: null, burn: null }
                    - { token_id: '81264573985362058461377125337283195667', quote_id: 0xa93f...0c2d, status: awaiting_payment, burned_at: null, burn_tx: null, burn: null }
                  fulfilment: null
                payment:
                  intent_id: pi_01JE...
                  client_secret: pi_01JE..._secret_...
                  publishable_key: pk_live_...
                  amount: 9.85
                  deposit_addresses:
                    - { chain: 'evm:8453', address: 0x5a4d...0002 }
                    - { chain: 'solana:mainnet', address: 7kPq...Rt4w }
        '200':
          description: A replay of an earlier request with the same `Idempotency-Key` (`idempotent_replay` is true).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateShipmentResponse' }
        '400': { $ref: '#/components/responses/ShipmentCreateBadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ShipmentCreateForbidden' }
        '404': { $ref: '#/components/responses/UnknownTokens' }
        '409': { $ref: '#/components/responses/ShipmentCreateConflict' }
        '422': { $ref: '#/components/responses/ShipmentKeyReused' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/ChainOrScreeningUnavailable' }
    get:
      tags: [Shipments]
      operationId: listShipments
      summary: List shipments
      description: Your shipments, newest first, one-token and multi-token together, each in its Get a shipment shape.
      parameters:
        - name: wallet
          in: query
          description: The `holder`, on your mint chain.
          schema: { type: string }
        - name: status
          in: query
          description: Only shipments in this status.
          schema:
            type: string
            enum: [awaiting_payment, ready, redeemed, expired, partially_redeemed]
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
