openapi: 3.1.0
info:
  title: CatchBack Partner API v2 (wallets & NFTs)
  version: 2.0.0
  summary: Sell CatchBack packs to your users' own web3 wallets, and let the NFT holder sell back or ship.
  description: |-
    The official contract for Partner API v2. Generate clients from this file.

    Each customer pays for their own pack (USDC on Base or Solana, through a Unifold Payment
    Intent), and each pulled item is minted as an NFT to the customer's wallet. Whoever holds the
    NFT can trade it, sell it back for USDC, or have the physical item shipped. Selling back and
    shipping both burn the NFT. Guides: [Overview](/partner-api/v2/overview).

    - **Auth:** every `/api/partner/v2` request sends your key as a bearer token, and every key
      needs the scope `nft:orders`. The public token metadata needs no key.
    - **Your program:** your key is linked to your partner program, which fixes the chain your
      NFTs mint on (`mint_chain`) and your collection contract. An order, token, quote or shipment
      from another program answers `404`.
    - **Formats:** JSON, UTF-8. Money is USD as a number in dollars (`25`, `9.85`). New fields can be
      added to any response; ignore fields you don't know.
    - **Errors:** bodies are `{ "error": "<message>" }`, and errors your integration should act on
      also carry a stable `code` (see `ErrorCode`). Branch on the status and the `code`, never on the
      message text. [Errors](/partner-api/v2/errors).
    - **Idempotency:** `POST /orders`, `POST /shipments`, `POST /tokens/{tokenId}/shipment` and
      `POST /keys/rotate` require an `Idempotency-Key`. [Idempotency](/partner-api/v2/idempotency).
    - **Sandbox:** the sandbox runs the same API with simulated payments on a public testnet. Its base
      URL is issued on request, with a sandbox key. The operations tagged `Sandbox` exist only there
      and answer `404` in production.
  contact:
    name: CatchBack support
    email: support@catchbackcards.com
servers:
  - url: https://catchbackcards.com
    description: Production. Every payment is real money. The sandbox base URL is issued on request.
tags:
  - name: Packs
    description: The packs you can sell, their odds and every item they can pull.
  - name: Orders
    description: Buy 1-10 packs for one wallet, follow the order to the mint, and prove the pull.
  - name: Tokens
    description: A wallet's tokens and one token's item, holder and sell-back schedule.
  - name: Sell-back
    description: Quote a sell-back, have the holder burn with it, and follow the USDC payout.
  - name: Shipments
    description: Pay shipping for 1-25 tokens, have the holder burn each one, and track the box.
  - name: Webhooks
    description: Register, read, test and remove your webhook URL.
  - name: Webhook events
    description: Signed POSTs we send to your webhook URL.
  - name: Keys
    description: Read, rotate and revoke your API key.
  - name: Revenue
    description: Your monthly revenue-share statement.
  - name: Sandbox
    description: Sandbox-only helpers. Every one answers `404` in production.
  - name: Metadata
    description: Public NFT metadata that wallets and marketplaces read with no key.
security:
  - bearerAuth: ['nft:orders']
# A keyless operation below says `security: [{}]`, not `[]`. With an empty list Mintlify falls
# back to docs.json's api.mdx.auth and shows a bearer header on the page.
paths:
  /api/partner/v2/catalog/packs:
    get:
      tags: [Packs]
      operationId: listPacks
      summary: List packs
      description: |-
        The packs you can sell in one category, with price, the odds choices each sells, art and the chase item on offer. A pack that isn't on sale right now stays listed with `available: false` and a `reason`. Whether a particular odds choice is selling right now is on [Get a pack's pool](#operation/getPackPool).
      parameters:
        - $ref: '#/components/parameters/PackCategory'
      responses:
        '200':
          description: The packs.
          content:
            application/json:
              schema:
                type: object
                required: [category, mint_chain, packs]
                properties:
                  category: { $ref: '#/components/schemas/PackCategory' }
                  mint_chain: { $ref: '#/components/schemas/ChainKey' }
                  packs:
                    type: array
                    items: { $ref: '#/components/schemas/PackCatalogItem' }
              example:
                category: pokemon
                mint_chain: 'evm:196'
                packs:
                  - pack_type: bronze
                    name: Bronze Pack
                    price: 25
                    available: true
                    odds: [standard, hot, chill, classic]
                    default_odds: standard
                    image_url: https://catchbackcards.com/_next/image?url=%2Fpacks%2Fbronze.png&w=1080&q=75
                    banner_url: https://catchbackcards.com/_next/image?url=%2Fpacks%2Fbronze-banner.png&w=1080&q=75
                    description: Graded Pokemon slabs from $7.50 up.
                    chase:
                      label: Charizard bounty
                      odds: '0.05%'
                      ends_at: '2026-11-30T00:00:00.000Z'
                      item:
                        id: 0e94dc61-5a2f-4b1e-9c3d-7f8a1b2c3d4e
                        category: pokemon
                        name: Charizard ex
                        grading_company: PSA
                        grading_rank: 10
                        render_image: https://...
                        market_value: 410
                  - pack_type: gold
                    name: Gold Pack
                    price: 100
                    available: false
                    reason: Restocking
                    odds: [standard, hot, chill, classic]
                    default_odds: standard
                    image_url: https://...
                    banner_url: null
                    description: null
                    chase: null
        '400':
          description: Unknown `category` (no `code`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: 'Unknown category: pokemn' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /api/partner/v2/catalog/packs/pool:
    get:
      tags: [Packs]
      operationId: getPackPool
      summary: Get a pack's pool
      description: |-
        What one pack can pull at one odds choice: the value bands with their chances, whether those odds are selling right now, and every item a pull can produce, highest value first. This is the same information as the odds panel in our app; show it to your customers before they buy.

        A pack that sells only its own odds answers `odds: "classic"` with its own band shape (`ClassicPackPool`). Every other pack answers `ModePackPool`.
      parameters:
        - name: pack_type
          in: query
          required: true
          description: A `pack_type` from List packs.
          schema: { type: string, minLength: 1, maxLength: 100 }
          example: bronze
        - $ref: '#/components/parameters/PackCategory'
        - name: odds
          in: query
          description: One the pack sells. Default the pack's `default_odds`.
          schema: { $ref: '#/components/schemas/Odds' }
      responses:
        '200':
          description: The pool at those odds.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PackPool' }
              example:
                pack_type: bronze
                name: Bronze Pack
                category: pokemon
                price: 25
                odds: hot
                label: Hot
                tagline: Fewer hits, bigger chase
                available: true
                fresh_buyback_rate: 1
                consolation_probability: null
                bands:
                  - { band: 7.5-15, min_value: 7.5, max_value: 15, odds: 0.61, cards: 380 }
                  - { band: 250-1000, min_value: 250, max_value: 1000, odds: 0.004, cards: 41 }
                odds_choices:
                  - { odds: standard, label: Standard, available: true }
                  - { odds: hot, label: Hot, available: true }
                  - { odds: chill, label: Chill, available: true }
                  - { odds: classic, label: Classic, available: true }
                total_cards: 1043
                cards:
                  - id: 0e94dc61-5a2f-4b1e-9c3d-7f8a1b2c3d4e
                    category: pokemon
                    name: Charizard ex
                    grading_company: PSA
                    grading_rank: 10
                    market_value: 410
                    render_image: https://...
                    band: 250-1000
        '400':
          description: |-
            - `BAD_PACK`: `pack_type` missing (or over 100 characters).
            - `BAD_CATEGORY`: unknown `category`.
            - `BAD_ODDS`: `odds` isn't `standard`, `hot`, `chill` or `classic`, or isn't one the pack sells; in the second case `odds` lists the choices it sells.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: 'bronze sells standard, hot, chill, classic', code: BAD_ODDS, odds: [standard, hot, chill, classic] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: '`PACK_NOT_OFFERED`: that pack isn''t sold through your program.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Unknown pack_type for pokemon. Use one from GET /api/partner/v2/catalog/packs., code: PACK_NOT_OFFERED }
        '409':
          description: '`ODDS_UNAVAILABLE`: those odds aren''t published for this pack right now; try another choice or later.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: hot odds are not published for bronze, code: ODDS_UNAVAILABLE }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /api/partner/v2/orders:
    post:
      tags: [Orders]
      operationId: createOrder
      summary: Create an order
      description: |-
        **Rate limit:** 30 a minute.

        One order buys 1-10 packs of one kind for one wallet, paid with one payment. `quantity` 2-10 makes a multi-pack order (`OrderBatch`): one payment for `quantity` × the pack price, whose units each open, mint and (if they must) refund on their own. The pack opens and the NFT mints once the payment settles; follow it with Get an order or the `nft_order.updated` webhook.

        A refused order creates nothing. A replay with the same `Idempotency-Key` and the same request answers `200` with `idempotent_replay: true` and the order as it stands now; once the order is past `awaiting_payment`, its `payment` has no `client_secret` and no deposit addresses.

        If the odds stop selling before the payment settles, the pack isn't opened at other odds: the order goes to `refund_due` and the customer is refunded.
      parameters:
        - $ref: '#/components/parameters/OrderIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
            example:
              pack_type: bronze
              category: pokemon
              odds: standard
              quantity: 1
              recipient: 0x8f3c...e21a
              refund_address: 0x8f3c...e21a
              partner_user_ref: okx-uid-102938
      responses:
        '201':
          description: The order and how to pay it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateOrderResponse' }
              examples:
                single:
                  summary: One pack
                  value:
                    order:
                      order_id: okx-ord-7f3a9c21
                      id: 3d2b8f0e-6c1a-4f7e-9a51-2b0d8c4e7f13
                      status: awaiting_payment
                      pack_type: bronze
                      category: pokemon
                      odds: standard
                      price: 25
                      recipient: 0x8f3c...e21a
                      mint_chain: 'evm:196'
                      paid_at: null
                      pull: null
                      token: null
                      failure_reason: null
                      created_at: '2026-11-16T18:02:11.420Z'
                    payment:
                      intent_id: pi_01JD...
                      client_secret: pi_01JD..._secret_...
                      publishable_key: pk_live_...
                      amount: 25
                      deposit_addresses:
                        - { chain: 'evm:8453', address: 0x5a4d...0001 }
                        - { chain: 'solana:mainnet', address: 9xQe...Vf2p }
                multi:
                  summary: Three packs
                  value:
                    order:
                      order_id: okx-ord-9b21e4c0
                      id: 5f1c2a90-8d3e-4b6a-9e1f-7c0a2b4d6e81
                      status: awaiting_payment
                      quantity: 3
                      pack_type: bronze
                      category: pokemon
                      odds: standard
                      unit_price: 25
                      price: 75
                      recipient: 0x8f3c...e21a
                      mint_chain: 'evm:196'
                      paid_at: null
                      units:
                        - { order_id: okx-ord-9b21e4c0, id: a0e1c3d5-2b4f-4e6a-8c1d-3f5a7b9c1e20, batch_id: 5f1c2a90-8d3e-4b6a-9e1f-7c0a2b4d6e81, unit: 1, status: awaiting_payment, pack_type: bronze, category: pokemon, odds: standard, price: 25, recipient: 0x8f3c...e21a, mint_chain: 'evm:196', paid_at: null, pull: null, token: null, failure_reason: null, created_at: '2026-11-16T18:02:11.420Z' }
                        - { order_id: okx-ord-9b21e4c0, id: b7d2e4f6-3c5a-4f7b-9d2e-4a6b8c0d2f31, batch_id: 5f1c2a90-8d3e-4b6a-9e1f-7c0a2b4d6e81, unit: 2, status: awaiting_payment, pack_type: bronze, category: pokemon, odds: standard, price: 25, recipient: 0x8f3c...e21a, mint_chain: 'evm:196', paid_at: null, pull: null, token: null, failure_reason: null, created_at: '2026-11-16T18:02:11.420Z' }
                        - { order_id: okx-ord-9b21e4c0, id: c4f9a1b3-4d6e-4a8c-8e3f-5b7c9d1e3a42, batch_id: 5f1c2a90-8d3e-4b6a-9e1f-7c0a2b4d6e81, unit: 3, status: awaiting_payment, pack_type: bronze, category: pokemon, odds: standard, price: 25, recipient: 0x8f3c...e21a, mint_chain: 'evm:196', paid_at: null, pull: null, token: null, failure_reason: null, created_at: '2026-11-16T18:02:11.420Z' }
                      created_at: '2026-11-16T18:02:11.420Z'
                    payment:
                      intent_id: pi_01JD...
                      client_secret: pi_01JD..._secret_...
                      publishable_key: pk_live_...
                      amount: 75
                      deposit_addresses:
                        - { chain: 'evm:8453', address: 0x5a4d...0001 }
                        - { chain: 'solana:mainnet', address: 9xQe...Vf2p }
        '200':
          description: A replay of an earlier request with the same `Idempotency-Key` (`idempotent_replay` is true). Nothing new is created and nothing is charged twice.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateOrderResponse' }
        '400':
          description: |-
            - `BAD_IDEMPOTENCY_KEY`: `Idempotency-Key` missing, or not 8-128 characters of `A-Za-z0-9_-`.
            - `BAD_JSON`: the body isn't JSON.
            - `BAD_RECIPIENT`: `recipient` is not a wallet address on your mint chain.
            - `BAD_PACK`: `pack_type` missing.
            - `BAD_CATEGORY`: unknown `category`.
            - `BAD_ODDS`: `odds` isn't `standard`, `hot`, `chill` or `classic`, or not one the pack sells (then `odds` lists the choices it sells).
            - `BAD_QUANTITY`: `quantity` isn't a whole number from 1 to 10.
            - `BAD_REFUND_ADDRESS`: no usable EVM `refund_address` (required when you mint on Solana).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: 'recipient must be a evm:196 wallet address', code: BAD_RECIPIENT }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: |-
            - `WALLET_REFUSED`: a wallet in the request failed sanctions screening.
            - `WALLET_BLOCKED`: this wallet may not buy from CatchBack.
            - Any of the key and program refusals every endpoint can return (`NO_PROGRAM`, `PROGRAM_INACTIVE`, `NOT_AVAILABLE`, a missing scope, `Access denied`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: This wallet cannot buy here., code: WALLET_REFUSED }
        '404':
          description: '`PACK_NOT_OFFERED`: that pack isn''t sold through your program.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: That pack is not sold through this program., code: PACK_NOT_OFFERED }
        '409':
          description: |-
            Nothing is created.
            - `ODDS_UNAVAILABLE`: those odds aren't selling right now; try another choice or later. `odds` echoes the choice.
            - `PACK_UNAVAILABLE`: a pack that sells only its own odds can't open right now; `reason` says why.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Bronze Pack isn't selling hot odds right now., code: ODDS_UNAVAILABLE, odds: hot }
        '422':
          description: '`IDEMPOTENCY_KEY_REUSED`: the key was already used for a different order.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: This Idempotency-Key was already used for a different order., code: IDEMPOTENCY_KEY_REUSED }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503':
          description: |-
            - `SCREENING_UNAVAILABLE`: wallet screening is briefly unavailable; retry shortly with the same `Idempotency-Key`.
            - `AUTH_UNAVAILABLE`, or no code: we couldn't check your key or load your program; retry after `Retry-After`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Wallet screening is unavailable; try again shortly., code: SCREENING_UNAVAILABLE }
    get:
      tags: [Orders]
      operationId: listOrders
      summary: List orders
      description: |-
        Your orders, newest first, each in the Get an order shape. The units of a multi-pack order are listed one by one, each with the order's `order_id`, its `batch_id` and its `unit` number. `partner_user_ref` matches the wallets you first sent with that ref.
      parameters:
        - $ref: '#/components/parameters/WalletFilter'
        - name: partner_user_ref
          in: query
          description: A `partner_user_ref` you sent with an order.
          schema: { type: string, pattern: '^[A-Za-z0-9_.:-]{1,128}$' }
        - name: status
          in: query
          description: Only orders in this status.
          schema:
            type: string
            enum: [awaiting_payment, paid, rolled, minted, mint_failed, expired, refund_due, refunded]
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of orders.
          content:
            application/json:
              schema:
                type: object
                required: [orders, next_cursor]
                properties:
                  orders:
                    type: array
                    items: { $ref: '#/components/schemas/OrderOrUnit' }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
              example:
                orders:
                  - order_id: okx-ord-7f3a9c21
                    id: 3d2b8f0e-6c1a-4f7e-9a51-2b0d8c4e7f13
                    status: minted
                    pack_type: bronze
                    category: pokemon
                    odds: standard
                    price: 25
                    recipient: 0x8f3c...e21a
                    mint_chain: 'evm:196'
                    paid_at: '2026-11-16T18:04:40.002Z'
                    pull: { card_id: a1c4e2f8-7b3d-4c5e-9f1a-2b3c4d5e6f70, category: pokemon, name: Charizard ex 199/165 PSA 10, value: 412.5, pulled_at: '2026-11-16T18:04:41.317Z' }
                    token: { chain: 'evm:196', contract: 0x7b1e...c0de, token_id: '81264573985362058461377125337283195667', status: confirmed, tx: 0x9f2a... }
                    failure_reason: null
                    created_at: '2026-11-16T18:02:11.420Z'
                next_cursor: WyIyMDI2LTExLTE2VDE4OjAyOjExLjQyMDEyMyswMDowMCIsIjNkMmI4ZjBlLS4uLiJd
        '400':
          description: |-
            - `BAD_CURSOR`: `cursor` isn't a `next_cursor` from a previous page.
            - `BAD_LIMIT`: `limit` isn't 1-100.
            - `BAD_STATUS`: `status` isn't one the list filters on.
            - `BAD_ADDRESS`: `wallet` is not an address on your mint chain.
            - `BAD_PARTNER_USER_REF`: `partner_user_ref` isn't 1-128 characters of `A-Za-z0-9_.:-`.
            - `TOO_MANY_WALLETS`: that `partner_user_ref` covers more than 200 wallets; filter by `wallet` instead.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: limit must be 1-100, code: BAD_LIMIT }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /api/partner/v2/orders/{id}:
    get:
      tags: [Orders]
      operationId: getOrder
      summary: Get an order
      description: |-
        One order. `{id}` is our `id` or your `Idempotency-Key`, so after a lost response you can always find out how an order ended. A multi-pack order's `id` or `Idempotency-Key` returns the whole order with its `units`; one unit's `id` returns that unit. It never includes the `payment`: replay the POST to get that back.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema:
                type: object
                required: [order]
                properties:
                  order: { $ref: '#/components/schemas/AnyOrder' }
              example:
                order:
                  order_id: okx-ord-7f3a9c21
                  id: 3d2b8f0e-6c1a-4f7e-9a51-2b0d8c4e7f13
                  status: minted
                  pack_type: bronze
                  category: pokemon
                  odds: standard
                  price: 25
                  recipient: 0x8f3c...e21a
                  mint_chain: 'evm:196'
                  paid_at: '2026-11-16T18:04:40.002Z'
                  pull:
                    card_id: a1c4e2f8-7b3d-4c5e-9f1a-2b3c4d5e6f70
                    category: pokemon
                    name: Charizard ex 199/165 PSA 10
                    value: 412.5
                    pulled_at: '2026-11-16T18:04:41.317Z'
                  token:
                    chain: 'evm:196'
                    contract: 0x7b1e...c0de
                    token_id: '81264573985362058461377125337283195667'
                    status: confirmed
                    tx: 0x9f2a...
                  failure_reason: null
                  created_at: '2026-11-16T18:02:11.420Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: '`UNKNOWN_ORDER`: no such order in your program, by id or `Idempotency-Key`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Unknown order, code: UNKNOWN_ORDER }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /api/partner/v2/orders/{id}/verification:
    get:
      tags: [Orders]
      operationId: getOrderVerification
      summary: Get an order's proof
      description: |-
        The provably-fair proof for an order's pull, and a public `verify_url` your customer can open to re-run the check with no key. `proof` is exactly what `verify_url` returns.

        `{id}` is a single order's `id` or `Idempotency-Key`, or one unit's `id`. A multi-pack order's own `id` or `Idempotency-Key` returns `BatchVerification`: one proof per unit (a unit not yet opened has `verified: null, pending: true`), and `verified` is true only when every unit's is.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: The proof.
          content:
            application/json:
              schema:
                type: object
                required: [verification]
                properties:
                  verification:
                    anyOf:
                      - $ref: '#/components/schemas/Verification'
                      - $ref: '#/components/schemas/BatchVerification'
              example:
                verification:
                  order_id: okx-ord-7f3a9c21
                  id: 3d2b8f0e-6c1a-4f7e-9a51-2b0d8c4e7f13
                  pull_id: 6a0f2c4e-8b1d-4f3a-9c5e-7d9f1b3a5c71
                  card_id: a1c4e2f8-7b3d-4c5e-9f1a-2b3c4d5e6f70
