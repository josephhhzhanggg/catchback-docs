        name: { type: [string, 'null'] }
        set: { type: [string, 'null'] }
        year: { type: [string, 'null'] }
        number: { type: [string, 'null'] }
        variant: { type: [string, 'null'] }
        rarity: { type: [string, 'null'] }
        card_type: { type: [string, 'null'] }
        language: { type: [string, 'null'] }
        slab_label: { type: [string, 'null'] }
        grading_company: { type: [string, 'null'] }
        grading_rank: { type: [number, 'null'] }
        card_condition: { type: [string, 'null'] }
        cert_number: { type: [string, 'null'] }
        brand: { type: [string, 'null'] }
        reference_number: { type: [string, 'null'] }
        video_url: { type: [string, 'null'] }
        condition: { type: [string, 'null'] }
        size: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        sport: { type: [string, 'null'] }
        player_name: { type: [string, 'null'] }
        team: { type: [string, 'null'] }
        manufacturer: { type: [string, 'null'] }
        parallel: { type: [string, 'null'] }
        is_rookie: { type: [boolean, 'null'] }
        is_autograph: { type: [boolean, 'null'] }
        is_memorabilia: { type: [boolean, 'null'] }
        serial_numbered: { type: [string, 'null'] }
        front_image: { type: [string, 'null'] }
        back_image: { type: [string, 'null'] }
        render_image: { type: [string, 'null'] }
        image_url: { type: [string, 'null'] }
    Pack:
      type: object
      required: [pack_type, name, price, available, max_quantity, risk_levels]
      properties:
        pack_type: { type: string, description: What Buy packs takes. }
        name: { type: string }
        price: { type: number, description: 'Price per pack in USD, the amount charged.' }
        available: { type: boolean, description: 'Whether the pack can be opened right now. Buy packs refuses one that can''t, with `409 PACK_UNAVAILABLE`, before charging anything.' }
        reason: { type: string, description: 'One of `Out of stock`, `Odds maintenance in progress`, `Restocking` or `Not available right now`. Only when `available` is `false`.' }
