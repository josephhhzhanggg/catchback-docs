        risk_levels:
          type: array
          items: { $ref: '#/components/schemas/RiskLevel' }
    PackPool:
      type: object
      required: [pack_type, name, category, risk_level, price, available, kind, expected_value, bands, chase, total_cards, cards]
      properties:
        pack_type: { type: string }
        name: { type: string }
        category: { type: string }
        risk_level: { type: string }
        price: { type: number, description: Price per pack in USD. }
        available: { type: boolean }
        reason: { type: string, description: Why the pack is unavailable. Only when a sold-out slab pack's pool is empty. }
        kind: { type: string, enum: [slab, sealed] }
        expected_value: { type: [number, 'null'], description: Expected value of one pack in USD at this risk level. }
        bands:
          type: array
          items:
            type: object
            required: [bucket_id, label, min_value, max_value, odds, is_consolation, hittable_cards]
            properties:
              bucket_id: { type: string, description: Band id. Each card's `bucket_id` points here. }
              label: { type: [string, 'null'], description: 'Display range, e.g. `$5-$20`. For a sealed pack, the product''s name.' }
              min_value: { type: number }
              max_value: { type: number }
              odds: { type: number, description: 'Probability of landing in this band, 0–1.' }
              is_consolation: { type: boolean }
              hittable_cards: { type: integer, description: How many cards in `cards` belong to this band. }
        chase:
          type: [object, 'null']
          description: A hand-picked card hittable at fixed odds on top of the bands, or `null`.
          properties:
            card:
              anyOf:
                - $ref: '#/components/schemas/Card'
                - type: 'null'
            probability: { type: number }
            odds_label: { type: string, description: 'e.g. `1 in 5,000`.' }
            label: { type: string }
            ends_at: { type: [string, 'null'] }
        total_cards: { type: integer }
        cards:
          type: array
          description: Every hittable card, highest value first. Empty for a sealed pack.
          items:
            allOf:
              - $ref: '#/components/schemas/Card'
              - type: object
                required: [bucket_id]
                properties:
                  bucket_id: { type: string }
        total_products: { type: integer, description: Sealed packs only. }
        products:
          type: array
          description: Sealed packs only. Every in-stock product, highest value first.
          items:
            type: object
            required: [id, bucket_id, market_value, in_stock, odds]
            properties:
              id: { type: string }
              bucket_id: { type: string }
              name: { type: [string, 'null'] }
              set: { type: [string, 'null'] }
              product_type: { type: [string, 'null'], description: 'e.g. `loose_pack`, `booster_bundle`.' }
              language: { type: [string, 'null'] }
              year: { type: [number, 'null'] }
              image: { type: [string, 'null'] }
              market_value: { type: number, description: USD. }
              in_stock: { type: integer }
              odds: { type: number, description: 'Probability of pulling this product, 0–1.' }
    PullHit:
      type: object
      description: The band, odds and chase the pull hit.
      properties:
        rarity_tier: { type: [string, 'null'] }
        bucket: { type: [string, 'null'] }
        bucket_odds: { type: [number, 'null'] }
        is_chase: { type: boolean }
        chase_label: { type: [string, 'null'] }
    SealedPackItem:
      type: object
      title: Sealed pack
      properties:
        id: { type: [string, integer, 'null'], description: A sealed product's id is a number. }
        name: { type: [string, 'null'] }
        set: { type: [string, 'null'] }
        category: { type: [string, 'null'] }
        image_url: { type: [string, 'null'] }
    PackPurchase:
      type: object
      required: [checkout_id, pack_type, quantity, total_charged]
      properties:
        checkout_id: { type: string, description: Our id for the order. Get an order takes it. }
        pack_type: { type: string }
        quantity: { type: integer }
        total_charged: { type: [number, 'null'] }
        remaining_balance: { type: number }
        summary:
          type: object
          required: [total_value, catchback_now_total, best_pull]
          properties:
            total_value: { type: number }
            catchback_now_total: { type: number }
            best_pull:
              type: [object, 'null']
              properties:
                pull_id: { type: string }
                name: { type: [string, 'null'] }
                value: { type: [number, 'null'] }
        pulls:
          type: array
          items:
            type: object
            required: [pull_id, kind, item, value, hit, catchback, proof]
            properties:
              pull_id: { type: string, description: The pull. Sell back and Verify a pull take it. }
              kind: { type: string, enum: [card, sealed_pack] }
              item:
                description: The [card object](/partner-api/card-object), or a sealed pack.
                anyOf:
                  - $ref: '#/components/schemas/Card'
                  - $ref: '#/components/schemas/SealedPackItem'
              value: { type: [number, 'null'], description: Market value at the pull. }
              hit: { $ref: '#/components/schemas/PullHit' }
              catchback:
                type: [object, 'null']
                description: What CatchBack pays for it now and after the fresh window. `null` for a sealed pack.
                properties:
                  amount: { type: number }
                  rate: { type: number }
                  valid_until: { type: [string, 'null'] }
                  after:
                    type: [object, 'null']
                    properties:
                      amount: { type: number }
                      rate: { type: number }
                      valid_until: { type: [string, 'null'] }
              proof:
                type: [object, 'null']
                description: The record to [check the draw](/partner-api/verify-a-pull) with. `null` for a guaranteed pull, which no roll chose.
                properties:
                  seed: { type: number }
                  verification_hash: { type: [string, 'null'] }
                  seed_commit_hash: { type: [string, 'null'] }
                  timestamp: { type: [string, 'null'] }
                  verify_path: { type: [string, 'null'], description: 'Send a `GET` to this path, with no key. `null` for a Steph Curry pull.' }
        idempotent_replay: { type: boolean, description: This answers a retry of a finished order. Nothing was charged again. }
        reconciled: { type: boolean, description: 'Present and `true` on the shorter body we return when we closed the order after its response was lost. It has `pull_ids` and a `message`, and no `pulls`, `summary` or `remaining_balance`.' }
        pull_ids: { type: array, items: { type: string }, description: Present with `reconciled`. The pulls in the order, which are in your vault. }
        message: { type: string, description: Present with `reconciled`. }
    OrderType:
      type: string
      enum: [pack_purchase, card_purchase, sell_back, listing_sale]
    Order:
      type: object
      required: [checkout_id, order_id, type, status, created_at, completed_at, amount, fee, balance_change, reconciled, pack_type, quantity, pull_ids, card_id, listing_id, transaction_id]
      properties:
        checkout_id: { type: string, description: The order's id. Get an order takes it. }
        order_id: { type: [string, 'null'], description: 'The `Idempotency-Key` you sent with a purchase. `null` for a sell-back or a sale.' }
        type: { $ref: '#/components/schemas/OrderType' }
        status: { type: string, description: '`completed`, or `pending` while a purchase is still running or held for review. New values can be added, so don''t fail on one you don''t know.' }
        created_at: { type: string }
        completed_at: { type: [string, 'null'] }
        amount: { type: [number, 'null'], description: 'What a purchase charged (a card buy includes its $1 fee), what a sell-back paid, or what a listing sold for, in USD.' }
        fee: { type: [number, 'null'], description: 'The $1 buyer fee on a card buy or the $1 seller fee on a sale. `0` otherwise.' }
        balance_change: { type: [number, 'null'], description: 'The order''s effect on your balance. `null` until something shows the order was charged.' }
        reconciled: { type: boolean, description: 'The order went through but its response was lost, and we closed it from our own records.' }
        pack_type: { type: [string, 'null'] }
        quantity: { type: [integer, 'null'] }
        pull_ids:
          type: array
          items: { type: string }
        card_id: { type: [string, 'null'] }
        listing_id: { type: [string, 'null'] }
        transaction_id: { type: [string, 'null'], description: 'For a card buy, the `purchase_id` that Get vault and Sell back use.' }
    OrderDetail:
      allOf:
        - $ref: '#/components/schemas/Order'
        - type: object
          required: [pulls, item, payout_rate, basis_value]
          properties:
            pulls:
              type: array
              description: A pack purchase's pulls. Empty for any other order.
              items:
                type: object
                required: [pull_id, kind, item, value, hit]
                properties:
                  pull_id: { type: string }
                  kind: { type: [string, 'null'], enum: [card, sealed_pack, null] }
                  item:
                    description: The card as it is now, a sealed pack, or `null` if we can't load it.
                    anyOf:
                      - $ref: '#/components/schemas/Card'
                      - $ref: '#/components/schemas/SealedPackItem'
                      - type: 'null'
                  value: { type: [number, 'null'], description: Market value at the pull. }
                  hit:
                    anyOf:
                      - $ref: '#/components/schemas/PullHit'
                      - type: 'null'
            item:
              description: The card, for a card buy, a sell-back or a sale.
              anyOf:
                - $ref: '#/components/schemas/Card'
                - type: 'null'
            payout_rate: { type: [number, 'null'], description: Sell-backs only. }
            basis_value: { type: [number, 'null'], description: Sell-backs only. }
    ShipmentCardIds:
      type: array
      minItems: 1
      maxItems: 10
      uniqueItems: true
      description: Card ids from Get vault, cards you hold in the vault. A listed card has to be delisted first.
      items: { type: string, format: uuid }
    ShipmentCoverAmount:
      type: number
      minimum: 100
      maximum: 10000
      description: 'Optional insurance: the dollars of cover, with at most two decimals, from $100 up to `max_cover` from the estimate. Leave it out and the only cover is what the carrier includes automatically: up to $100 on USPS and UPS labels. Other carriers may include less or none. You carry any loss above your cover.'
    ShipmentAddress:
      type: object
      description: Your customer's address. Stored only with a shipment, never in logs or on your account.
      required: [name, address1, city, country]
      properties:
        name: { type: string, maxLength: 100, description: Recipient name. }
        address1: { type: string, maxLength: 100 }
        address2: { type: string, maxLength: 100 }
        city: { type: string, maxLength: 100 }
        state: { type: string, maxLength: 100, description: 'State or region, where the country has one.' }
        zip: { type: string, maxLength: 20, description: 'Postal code, where the country has one.' }
        country: { type: string, description: 'ISO 3166 alpha-2, e.g. `US`. Shipping countries lists where we ship.' }
        phone: { type: string, maxLength: 20, description: Required outside the US. }
    ShipmentStatus:
      type: string
      description: |-
        - `pending`: the shipment hasn't reached an order yet.
        - `needs_review`: we couldn't confirm the charge, and it's with our team.
        - `processing`: the order is queued for fulfillment.
        - `shipped`, `delivered`: the carrier has it, or has delivered it.
        - `cancelled`: the order was cancelled or resolved outside shipping.
      enum: [pending, needs_review, processing, shipped, delivered, cancelled]
    ShipmentEvent:
      type: object
      description: A shipment as a webhook sends it. It has nothing from the customer's address.
      required: [id, status, card_ids, carrier, service, service_token, cost, cover_amount, insurance_cost, tracking_number, tracking_url, created_at, status_updated_at, shipped_at, expected_delivery, delivered_at]
      properties:
        id: { type: string, description: The shipment's id. Get a shipment takes it. }
        status: { $ref: '#/components/schemas/ShipmentStatus' }
        card_ids:
          type: array
          items: { type: string }
        carrier: { type: [string, 'null'], description: '`null` until we''ve confirmed a rate.' }
        service: { type: [string, 'null'] }
        service_token: { type: [string, 'null'] }
        cost: { type: [number, 'null'], description: 'What the shipment charges in USD, including any insurance premium. `null` until we''ve confirmed a rate.' }
        cover_amount: { type: [number, 'null'], description: 'The insurance on this shipment, in USD. `null` without insurance, and before the order exists.' }
        insurance_cost: { type: [number, 'null'], description: 'The premium in USD, which is part of `cost`. `0` without insurance, and `null` before the order exists.' }
        tracking_number: { type: [string, 'null'], description: '`null` until there''s a label.' }
        tracking_url: { type: [string, 'null'] }
        created_at: { type: string }
        status_updated_at: { type: [string, 'null'], description: When the order's status last changed. }
        shipped_at: { type: [string, 'null'] }
        expected_delivery: { type: [string, 'null'] }
        delivered_at: { type: [string, 'null'] }
        needs_review: { type: boolean, description: 'Present and `true` while `status` is `needs_review`.' }
    Shipment:
      allOf:
        - $ref: '#/components/schemas/ShipmentEvent'
        - type: object
          required: [destination_country]
          properties:
            destination_country: { type: string }
            address_removed: { type: boolean, description: Present and `true` once we've removed the address. }
    ShipmentDetail:
      allOf:
        - $ref: '#/components/schemas/Shipment'
        - type: object
          required: [items, address]
          properties:
            items:
              type: array
              description: The cards in the shipment. Empty until the order exists.
              items:
                type: object
                required: [card_id, name, grade, grading_company, value]
                properties:
                  card_id: { type: string }
                  name: { type: [string, 'null'] }
                  grade: { type: [number, 'null'] }
                  grading_company: { type: [string, 'null'] }
                  value: { type: [number, 'null'], description: The card's market value in USD when you created the shipment. }
            address:
              type: [object, 'null']
              description: Where it ships to. `null` until the order exists, and after we've removed the address.
              properties:
                name: { type: [string, 'null'] }
                address1: { type: string }
                address2: { type: [string, 'null'] }
                city: { type: string }
                state: { type: [string, 'null'] }
                zip: { type: [string, 'null'] }
                country: { type: string }
                phone: { type: [string, 'null'] }
    TestAccount:
      type: object
      required: [user_id, email, username, balance, created_at, expires_at, active]
      properties:
        user_id: { type: string, description: The account's id. }
        email: { type: string, description: 'The login, a made-up address nobody reads.' }
        username: { type: [string, 'null'] }
        balance: { type: [number, 'null'], description: The test balance in dollars. It isn't money and can't be withdrawn. }
        created_at: { type: string }
        expires_at: { type: string, description: 30 days after it was created. }
        active: { type: boolean, description: '`false` from its `expires_at`, or once it has been turned off.' }
    WebhookEnvelope:
      type: object
      required: [id, type, created_at, data]
      properties:
        id: { type: string, description: 'The event''s id, `evt_` and 32 hex characters. It never changes, including across retries, so dedupe on it.' }
        type: { type: string, description: 'More event types will be added without notice, so ignore a `type` you don''t recognize.' }
        created_at: { type: string, format: date-time, description: 'When the thing happened, not when we sent the event.' }
        data: { type: object }
